<!doctype html>
<html lang="en">
<head>

<title>Illuminate3D</title>
<meta name="description" content="Design 3D-printable lampshades with twist-lock, socket and LED puck connectors.">
<meta name="theme-color" content="#1f1f21">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root {
  --bg: #f4f3f0; --panel: #ffffff; --panel-2: #f7f6f3; --line: #e3e1dc; --text: #1d1d1f; --muted: #6e6e73;
  --accent: #d9822b; --accent-soft: rgba(217,130,43,.14); --ok: #2f9e55; --warn: #d7462e; --view: radial-gradient(ellipse at 50% 35%, #ffffff 0%, #e9e7e2 70%);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161617; --panel: #1f1f21; --panel-2: #262628; --line: #333336; --text: #f2f2f4; --muted: #9a9aa0;
    --accent: #f0a050; --accent-soft: rgba(240,160,80,.16); --ok: #4cc27a; --warn: #ff6b55; --view: radial-gradient(ellipse at 50% 35%, #2c2c2f 0%, #141415 75%);
  }
}
:root[data-theme="dark"] {
  --bg: #161617; --panel: #1f1f21; --panel-2: #262628; --line: #333336; --text: #f2f2f4; --muted: #9a9aa0;
  --accent: #f0a050; --accent-soft: rgba(240,160,80,.16); --ok: #4cc27a; --warn: #ff6b55; --view: radial-gradient(ellipse at 50% 35%, #2c2c2f 0%, #141415 75%);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; }
#app { display: grid; grid-template-columns: 384px 1fr; height: 100vh; }
aside { display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line); min-height: 0; }
header { padding: 14px 16px 10px; display: flex; align-items: baseline; gap: 8px; }
header h1 { font-size: 16px; margin: 0; letter-spacing: -.01em; }
#projName { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px; padding: 2px 6px; border-radius: 6px; cursor: text; max-width: 210px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#projName:hover { background: var(--panel-2); color: var(--text); }
#projDirty { color: var(--accent); font-size: 10px; visibility: hidden; }
#projDirty.on { visibility: visible; }
#filebar { display: flex; gap: 4px; padding: 0 12px 10px; }
#filebar button { flex: 1; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); border-radius: 7px; padding: 5px 0; font: inherit; font-size: 12px; cursor: pointer; }
#filebar button:hover { border-color: var(--accent); }
#filebar button.icon { flex: 0 0 34px; display: grid; place-items: center; }
#filebar button:disabled { opacity: .35; cursor: default; border-color: var(--line); }
#toast { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 14px; font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; }
#toast.on { opacity: 1; }
#modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; z-index: 10; padding: 16px; }
#modal[hidden] { display: none; }
.sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; width: min(860px, 100%); max-height: 86vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
.sheethead, .sheetfoot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; }
.sheethead h2 { margin: 0; font-size: 16px; }
.sheetfoot { border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; justify-content: flex-start; }
#projGrid { overflow-y: auto; padding: 4px 16px 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.pcard { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel-2); }
.pcard.cur { border-color: var(--accent); }
.pcard img { display: block; width: 100%; aspect-ratio: 4/3; object-fit: cover; background: #1c1c1e; cursor: pointer; }
.pcard .pmeta { padding: 8px 10px 4px; }
.pcard .pname { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pcard .pdate { color: var(--muted); font-size: 11px; }
.pcard .pact { display: flex; gap: 4px; padding: 6px 8px 8px; }
.pcard .pact button { flex: 1; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 11px; padding: 4px 0; border-radius: 5px; cursor: pointer; }
.pcard .pact button:hover { background: var(--panel); color: var(--text); }
.pempty { grid-column: 1 / -1; color: var(--muted); text-align: center; padding: 40px 0; }
nav { display: flex; gap: 4px; padding: 0 12px 10px; border-bottom: 1px solid var(--line); }
nav button { flex: 1; border: 0; background: transparent; color: var(--muted); padding: 7px 0; border-radius: 7px; font: inherit; font-weight: 600; cursor: pointer; }
nav button.on { background: var(--accent-soft); color: var(--accent); }
#panels { flex: 1; overflow-y: auto; padding: 4px 16px 16px; min-height: 0; }
.panel { display: none; } .panel.on { display: block; }
h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 8px; font-weight: 700; }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px 4px; margin: 8px 0; background: var(--panel-2); }
.card > .cardhead { display: flex; align-items: center; justify-content: space-between; font-weight: 600; padding-bottom: 4px; }
.card.off > .ctl { display: none; }
.ctl { display: grid; grid-template-columns: 112px 1fr 62px; align-items: center; gap: 8px; margin: 6px 0; }
.ctl.wide { grid-template-columns: 112px 1fr; }
.ctl label { color: var(--muted); font-size: 12px; }
.ctl .lim { display: block; font-size: 10px; color: var(--accent); }
.ctl .lim { cursor: help; }
.ctl .lim .warn { display: inline-grid; place-items: center; width: 13px; height: 13px; margin-left: 4px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 9px; font-weight: 800; vertical-align: 1px; }
#tipbox { position: fixed; z-index: 30; max-width: 260px; padding: 8px 10px; border-radius: 8px; background: var(--panel); color: var(--text); border: 1px solid var(--line); box-shadow: 0 8px 24px rgba(0,0,0,.25); font-size: 12px; line-height: 1.4; pointer-events: none; display: none; }
.ctl[hidden], .card[hidden], h3[hidden] { display: none !important; }
input[type=range] { width: 100%; accent-color: var(--accent); }
input[type=number], select { width: 100%; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; font: inherit; }
input[type=number] { text-align: right; padding-right: 4px; }
.seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 2px; gap: 2px; }
.seg button { flex: 1; border: 0; background: transparent; color: var(--muted); padding: 4px 2px; border-radius: 5px; font: inherit; font-size: 12px; cursor: pointer; }
.seg button.on { background: var(--accent); color: #fff; }
.switch { position: relative; width: 34px; height: 20px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; background: var(--line); border-radius: 20px; transition: .15s; cursor: pointer; }
.switch span::after { content: ""; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; background: #fff; border-radius: 50%; transition: .15s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(14px); }
.presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.btn { border: 1px solid var(--line); background: var(--panel-2); color: var(--text); border-radius: 7px; padding: 6px 8px; font: inherit; font-size: 12px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn:disabled { opacity: .5; cursor: default; }
#profileWrap { border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); margin-top: 10px; }
#profileCanvas { width: 100%; height: 250px; display: block; touch-action: none; cursor: crosshair; }
.hint { color: var(--muted); font-size: 11px; padding: 0 10px 8px; }
.note { color: var(--muted); font-size: 12px; margin: 6px 0; }
footer { border-top: 1px solid var(--line); padding: 10px 16px 14px; }
#checks { list-style: none; margin: 0 0 10px; padding: 0; font-size: 12px; }
#checks li { display: flex; gap: 6px; padding: 2px 0; }
#checks li b { width: 14px; flex: none; }
#checks li.ok b { color: var(--ok); } #checks li.bad b { color: var(--warn); }
.exports { display: flex; gap: 8px; } .exports .btn { flex: 1; padding: 9px 8px; }
main { position: relative; background: var(--view); min-width: 0; }
main canvas { display: block; width: 100%; height: 100%; }
#toolbar { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
#toolbar button { border: 0; background: transparent; color: var(--text); padding: 6px 10px; border-radius: 7px; font: inherit; font-size: 12px; cursor: pointer; white-space: nowrap; }
#toolbar button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
#toolbar button[hidden] { display: none; }
.tbsep { width: 1px; background: var(--line); margin: 4px 2px; }
#dims { position: absolute; left: 14px; bottom: 12px; color: var(--muted); font-size: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
#busy { position: absolute; inset: 0; display: none; place-items: center; background: rgba(0,0,0,.25); color: #fff; font-weight: 600; font-size: 14px; }
#busy.on { display: grid; }
@media (max-width: 820px) {
  #app { grid-template-columns: 1fr; grid-template-rows: 46vh 1fr; height: auto; min-height: 100vh; }
  main { grid-row: 1; height: 46vh; }
  aside { grid-row: 2; border-right: 0; }
  #panels { overflow: visible; }
  #toolbar { max-width: calc(100% - 32px); overflow-x: auto; }
}
</style>

<body>
<div id="app">
  <aside>
    <header><h1>Illuminate3D</h1><button id="projName" title="Rename project"></button><span id="projDirty" title="Unsaved changes">●</span></header>
    <div id="filebar">
      <button id="fNew" title="Start a new design">New</button>
      <button id="fOpen" title="Open a saved project (⌘O)">Open…</button>
      <button id="fSave" title="Save (⌘S)">Save</button>
      <button id="fSaveAs" title="Save a copy under a new name">Save as…</button>
      <button id="fUndo" class="icon" title="Undo (⌘Z)" aria-label="Undo" disabled><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button id="fRedo" class="icon" title="Redo (⇧⌘Z)" aria-label="Redo" disabled><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
    </div>
    <nav id="tabs">
      <button data-tab="shape" class="on">Shape</button>
      <button data-tab="pattern">Pattern</button>
      <button data-tab="connector">Connector</button>
      <button data-tab="print">Print</button>
    </nav>
    <div id="panels">
      <div class="panel on" id="p-shape"></div>
      <div class="panel" id="p-pattern"></div>
      <div class="panel" id="p-connector"></div>
      <div class="panel" id="p-print"></div>
    </div>
    <footer>
      <ul id="checks"></ul>
      <div class="exports">
        <button class="btn primary" id="expShade">Export shade STL</button>
        <button class="btn primary" id="expBase">Export base STL</button>
      </div>
    </footer>
  </aside>
  <main id="view">
    <div id="toolbar">
      <button id="tbShade" class="on" title="Show or hide the shade">Shade</button>
      <button id="tbBase" class="on" title="Show or hide the base">Base</button>
      <button id="tbHw" class="on" title="Show or hide the socket, bulb or puck">Hardware</button>
      <span class="tbsep"></span>
      <button id="tbOver" class="on">Overhangs</button>
      <button id="tbCut">Cutaway</button>
      <button id="tbExplode">Explode</button>
      <button id="tbLight">Light on</button>
      <button id="tbReset">Reset view</button>
    </div>
    <div id="dims"></div>
    <div id="busy">Loading geometry engine…</div>
    <div id="toast"></div>
    <div id="tipbox"></div>
  </main>
</div>
<div id="modal" hidden>
  <div class="sheet" role="dialog" aria-label="Projects">
    <div class="sheethead"><h2>Projects</h2><button class="btn" id="mClose">Close</button></div>
    <div id="projGrid"></div>
    <div class="sheetfoot">
      <button class="btn" id="mImport">Import .json…</button>
      <span>Projects are saved in this browser. Export a .json file to back them up or move them to another device.</span>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import Module from './vendor/manifold/manifold.js';

const TAU = Math.PI * 2, DEG = Math.PI / 180;

// ---------------------------------------------------------------- reference data
// Hole diameters are typical values; measure your own holder and adjust.
const FITTINGS = {
  E27: { label: 'E27 Edison socket', hole: 40.5, bodyD: 44, bulbR: 30, bulbZ: 78 },
  E14: { label: 'E14 small Edison', hole: 29, bodyD: 32, bulbR: 18, bulbZ: 58 },
  B22: { label: 'B22 bayonet', hole: 29.5, bodyD: 34, bulbR: 30, bulbZ: 78 },
  M10: { label: 'M10 nipple (cord set)', hole: 10.5, bodyD: 44, bulbR: 30, bulbZ: 78 },
  custom: { label: 'Custom hole', hole: null, bodyD: null, bulbR: 30, bulbZ: 78 },
};
const PUCKS = {
  p70: { label: 'USB puck Ø70 × 16', d: 70, h: 16 },
  p50: { label: 'Small puck Ø50 × 12', d: 50, h: 12 },
  p90: { label: 'Large puck Ø90 × 20', d: 90, h: 20 },
  custom: { label: 'Custom size', d: null, h: null },
};
const PRINTERS = {
  b180: { label: 'Bambu A1 mini (180³)', x: 180, y: 180, z: 180 },
  b256: { label: 'Bambu A1 / P1S / X1 (256³)', x: 256, y: 256, z: 256 },
  mk4: { label: 'Prusa MK4 (250×210×220)', x: 250, y: 210, z: 220 },
  e3: { label: 'Ender 3 (220×220×250)', x: 220, y: 220, z: 250 },
  big: { label: 'Large format (350³)', x: 350, y: 350, z: 350 },
};
const PROFILES = {
  Drum: [[0, 70], [1, 70]],
  Barrel: [[0, 55], [0.45, 82], [1, 60]],
  Bell: [[0, 88], [0.3, 76], [0.75, 48], [1, 32]],
  Globe: [[0, 38], [0.18, 72], [0.5, 90], [0.82, 72], [1, 38]],
  Cone: [[0, 92], [1, 38]],
  Tulip: [[0, 42], [0.4, 66], [0.8, 78], [1, 92]],
  Hourglass: [[0, 78], [0.5, 46], [1, 78]],
  Lantern: [[0, 50], [0.12, 72], [0.88, 72], [1, 50]],
};

const DEFAULT = {
  v: 1,
  height: 170, width: 1, aspect: 1, smooth: 0.15, curve: 'smooth',
  profile: [[0, 55], [0.45, 82], [1, 60]],
  sides: 0, round: 0.35, twist: 0, twistStyle: 'linear', wall: 1.6,
  pat: {
    ribs:    { on: false, count: 24, depth: 2, sharp: 1.5 },
    spiral:  { on: true, count: 24, turns: 0.6, depth: 2.5, sharp: 1.5 },
    rings:   { on: false, count: 20, depth: -1.5, sharp: 2 },
    wavy:    { on: false, count: 14, waves: 6, amp: 1.5, depth: 2, sharp: 1.5 },
    diamond: { on: false, count: 20, rows: 10, depth: 2.5 },
    bubbles: { on: false, count: 18, size: 0.85, depth: 2.5 },
    noise:   { on: false, scale: 25, depth: 2.5, octaves: 3, seed: 7 },
  },
  fadeConn: 10, fadeOpen: 4,
  orient: 'table', mount: 'twist',
  fitting: 'E27', holeD: 40.5, socketD: 44,
  ringStyle: 'spokes', spokes: 4, spokeW: 7, hubW: 6, plateT: 2.6,
  baseType: 'table', insert: 'puck', puck: 'p70', puckD: 70, puckH: 16,
  slotD: 33, slotH: 5, slotW: 6, seatDepth: 2, slotPlateT: 2, slotStyle: 'straight',
  collarD: 76, collarWall: 2.4, collarH: 14,
  lugs: 3, lugW: 22, lugH: 4, lugDepth: 2, turn: 30, clearance: 0.3, detent: true,
  baseD: 116, baseTopD: 96, baseH: 42, footChamfer: 0.6, cableW: 5, cableD: 3, cableGrip: true,
  printer: 'b256', material: 'PLA', overhang: 50,
  previewRes: 180, previewLayer: 1, exportQ: 'fine',
  color: '#f2ede4', baseColor: '#3a3a3c',
};
const clone = o => JSON.parse(JSON.stringify(o));
function merge(dst, src) { for (const k in src) { if (src[k] && typeof src[k] === 'object' && !Array.isArray(src[k]) && dst[k] && typeof dst[k] === 'object') merge(dst[k], src[k]); else if (k in dst) dst[k] = src[k]; } return dst; }

let P = clone(DEFAULT);
// cur: the open project. snap is the design as last saved/opened; it differs from P when there are unsaved changes.
let cur = { id: null, name: 'Untitled lamp', snap: null };
try { Object.assign(cur, JSON.parse(localStorage.getItem('illum.current')) || {}); } catch (e) { /* no current project */ }
try {
  const h = location.hash.slice(1);
  if (h.startsWith('d=')) {
    merge(P, JSON.parse(decodeURIComponent(escape(atob(h.slice(2))))));
    cur = { id: null, name: 'Shared design', snap: null };
    history.replaceState(null, '', location.pathname + location.search);
  } else { const s = localStorage.getItem('lampstudio'); if (s) merge(P, JSON.parse(s)); else cur.snap = JSON.stringify(P); }
} catch (e) { /* ignore bad saved state */ }

const getK = k => k.split('.').reduce((o, p) => o[p], P);
const setK = (k, v) => { const ps = k.split('.'); const last = ps.pop(); ps.reduce((o, p) => o[p], P)[last] = v; };

// ---------------------------------------------------------------- shade geometry
function buildProfile() {
  const pts = P.profile.slice().sort((a, b) => a[0] - b[0]);
  const k = pts.length, n = 400, out = new Float64Array(n + 1);
  const m = pts.map((p, i) => {
    if (P.curve === 'linear') return 0;
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(k - 1, i + 1)];
    return (b[1] - a[1]) / Math.max(1e-6, b[0] - a[0]);
  });
  let s0 = 0;
  for (let s = 0; s <= n; s++) {
    const z = s / n;
    while (s0 < k - 2 && z > pts[s0 + 1][0]) s0++;
    const p0 = pts[s0], p1 = pts[Math.min(s0 + 1, k - 1)];
    const h = Math.max(1e-6, p1[0] - p0[0]);
    const u = Math.min(1, Math.max(0, (z - p0[0]) / h));
    if (P.curve === 'linear') out[s] = p0[1] + (p1[1] - p0[1]) * u;
    else {
      const u2 = u * u, u3 = u2 * u;
      out[s] = (2 * u3 - 3 * u2 + 1) * p0[1] + (u3 - 2 * u2 + u) * h * m[s0] + (-2 * u3 + 3 * u2) * p1[1] + (u3 - u2) * h * m[Math.min(s0 + 1, k - 1)];
    }
  }
  const sig = P.smooth * 40;
  if (sig > 0.5) {
    const rad = Math.ceil(sig * 3), w = [];
    for (let i = -rad; i <= rad; i++) w.push(Math.exp(-(i * i) / (2 * sig * sig)));
    const src = out.slice();
    for (let s = 0; s <= n; s++) {
      let acc = 0, ws = 0;
      for (let i = -rad; i <= rad; i++) { const j = Math.min(n, Math.max(0, s + i)); acc += src[j] * w[i + rad]; ws += w[i + rad]; }
      out[s] = acc / ws;
    }
  }
  for (let s = 0; s <= n; s++) out[s] = Math.max(6, out[s]);
  return out;
}

function makeShapeF() {
  const n = Math.round(P.sides), ro = P.round, asp = P.aspect;
  const seg = TAU / n, half = Math.PI / n;
  const c = (1 - ro) / Math.cos(half);
  const xt = Math.atan((1 - ro) * Math.tan(half));
  return a => {
    let f = 1;
    if (n >= 3) {
      const x = Math.abs((((a % seg) + seg) % seg) - half);
      if (x <= xt) f = 1 / Math.cos(x);
      else { const d = half - x, sd = Math.sin(d); f = c * Math.cos(d) + Math.sqrt(Math.max(0, ro * ro - c * c * sd * sd)); }
    }
    if (asp !== 1) { const ca = Math.cos(a), sa = Math.sin(a) / asp; f /= Math.sqrt(ca * ca + sa * sa); }
    return f;
  };
}

function hash3(x, y, z, seed) {
  let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(z, 1440670441) ^ Math.imul(seed, 2246822519);
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h & 0xffff) / 32767.5 - 1;
}
function vnoise(x, y, z, seed) {

let W = null;

function baseDims() {

  collarH: () => [P.lugH + P.lugDepth + 3, 30, `the collar needs room for the ${fmt(P.lugH)} mm lug and the 45° chamfer above it.`],
  lugW: () => [8, 360 / P.lugs - 10 - 2 * lockSlack() - 4, `with ${P.lugs} lugs, each lug plus its turn has to fit in ${fmt(360 / P.lugs)}°.`],

      for (const y of [-P.cableW / 2, P.cableW / 2]) pins.push(tr(cyl(P.cableW, rn, rn, 20), x, y, 0));
    if (pins.length) result = keep(result.add(sub(uni(pins), sub(tr(cyl(P.cableW + 2, B.Rb + 5, B.Rb + 5, seg), 0, 0, -1), body))));
  }
  if (P.detent) {
    const bumps = [], len = g1 - (B.Ro + 0.3);
    for (let k = 0; k < P.lugs; k++) {
      const th = k * 360 / P.lugs + P.lugW / 2 - P.turn + ca + 1.5;
      bumps.push(rotZ(tr(rot(cyl(len, 0.9, 0.9, 16), [0, 90, 0]), B.Ro + 0.3, 0, f - 0.45), th));
    }

  }
  return result;
}

// ---------------------------------------------------------------- three.js scene
const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });

const view3 = { over: true, cut: false, explode: false, light: false, shade: true, base: true, hw: true };
let firstFrame = true;

function resize() { const r = view.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); camera.aspect = r.width / Math.max(1, r.height); camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(view);

renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });

// caps are always built and only shown/hidden, so the cutaway never depends on a rebuild having run
function addCap(parent, geo, cap) { const m = new THREE.Mesh(geo, cap); m.userData.cap = true; m.visible = view3.cut; parent.add(m); }
function addSolid(g, geo, mat, cap) { g.add(new THREE.Mesh(geo, mat)); addCap(g, geo, cap); }
function applyCut() {
  renderer.clippingPlanes = view3.cut ? [new THREE.Plane(new THREE.Vector3(0, 0, -1), 0)] : [];

}
function clearGroup(g) { for (const c of [...g.children]) { if (c.isLight) continue; g.remove(c); c.geometry?.dispose(); } }
function manifoldToGeo(man) {
  const mesh = man.getMesh(), np = mesh.numProp, v = mesh.vertProperties, t = mesh.triVerts;
  const pos = new Float32Array(t.length * 3);
  for (let i = 0; i < t.length; i++) { const b = t[i] * np; pos[i * 3] = v[b]; pos[i * 3 + 1] = v[b + 1]; pos[i * 3 + 2] = v[b + 2]; }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.computeVertexNormals();
  return g;
}
function zCyl(rTop, rBot, h, z0, mat = ghostMat) {
  const g = new THREE.CylinderGeometry(rTop, rBot, h, 48); g.rotateX(Math.PI / 2); g.translate(0, 0, z0 + h / 2);
  return new THREE.Mesh(g, mat);
}

// ---------------------------------------------------------------- update cycle
let lastStats = null;
function analyse(S, geo) {
  const nrm = geo.attributes.normal.array, NM = S.N * S.M;
  const col = new Float32Array(NM * 2 * 3);
  const base = new THREE.Color(P.color), red = new THREE.Color('#ff3b30');
  const zMin = (P.mount === 'twist' ? S.zStart : 0) + 0.6, lim = P.overhang;
  let bad = 0, total = 0, maxOver = 0;
  for (let k = 0; k < NM; k++) {
    const i = Math.floor(k / S.N), z = S.rowZ[i];
    let flag = false;
    if (z > zMin && i < S.M - 1) {
      const ov = Math.max(-nrm[k * 3 + 2], -nrm[(NM + k) * 3 + 2]);
      const deg = ov > 0 ? Math.asin(Math.min(1, ov)) / DEG : 0;
      total++; if (deg > maxOver) maxOver = deg;
      if (deg > lim + 0.5) { bad++; flag = true; }
    }
    const c = flag && view3.over ? red : base;
    col[k * 3] = col[(NM + k) * 3] = c.r; col[k * 3 + 1] = col[(NM + k) * 3 + 1] = c.g; col[k * 3 + 2] = col[(NM + k) * 3 + 2] = c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return { badPct: total ? bad / total * 100 : 0, maxOver };
}

function update() {
  try { applyConstraints(); refreshAll(); } catch (e) { console.error(e); }
  const S = buildShade(Math.round(P.previewRes), P.previewLayer);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(S.pos, 3));
  geo.setIndex(new THREE.BufferAttribute(S.idx, 1));
  geo.computeVertexNormals();
  const ov = analyse(S, geo);
  clearGroup(shadeGroup); clearGroup(baseGroup); clearGroup(ghostGroup);
  addSolid(shadeGroup, geo, shadeMat, capShadeMat);
  connMat.color.set(P.color); baseMat.color.set(P.baseColor);

  let connVol = 0, baseVol = 0, baseBox = null;
  const B = baseDims();
  if (W) gcScope(() => {
    const c = shadeConnector(S, 96, 0);
    if (c) { addSolid(shadeGroup, manifoldToGeo(c), connMat, capShadeMat); connVol = c.volume(); }
    if (P.mount === 'twist') { const b = buildBase(96); addSolid(baseGroup, manifoldToGeo(b), baseMat, capBaseMat); baseVol = b.volume(); baseBox = b.boundingBox(); }
  });

  // place parts (assembly coords: base print frame, Z up)
  const twist = P.mount === 'twist';
  const ex = view3.explode && twist ? 60 : 0;
  shadeGroup.position.set(0, 0, twist ? B.f + ex : 0);
  shadeGroup.rotation.z = twist && !view3.explode ? -P.turn * DEG : 0;
  assembly.rotation.x = P.orient === 'pendant' ? Math.PI : 0;
  shadeGroup.visible = view3.shade; baseGroup.visible = view3.base; ghostGroup.visible = view3.hw;

  // ghost hardware: socket + bulb, or LED puck
  const fit = FITTINGS[P.fitting] || FITTINGS.E27;
  let lightZ = null;
  if (P.mount === 'ring' || (twist && B.insert === 'socket')) {
    const z0 = twist ? B.f - P.plateT : 0, br = P.holeD / 2 - 0.5;
    ghostGroup.add(zCyl(P.socketD / 2 - 1, P.socketD / 2 - 1, 42, z0 - 44));
    ghostGroup.add(zCyl(br, br, 14, z0 - 2));
    ghostGroup.add(zCyl(fit.bulbR * 0.45, fit.bulbR * 0.5, fit.bulbZ - fit.bulbR * 0.6 - 12, z0 + 12, glowMat));
    const bulb = new THREE.Mesh(new THREE.SphereGeometry(fit.bulbR, 40, 24), glowMat); bulb.position.z = z0 + fit.bulbZ; ghostGroup.add(bulb);
    lightZ = z0 + fit.bulbZ;
  } else if (twist && B.insert === 'puck') {
    ghostGroup.add(zCyl(P.puckD / 2, P.puckD / 2, P.puckH - 2, B.f - P.puckH));
    ghostGroup.add(zCyl(P.puckD / 2 - 6, P.puckD / 2 - 6, 2, B.f - 2, glowMat));
    lightZ = B.f + 30;
  } else if (twist && B.insert === 'slot') {
    const z = B.f - P.seatDepth, r = P.slotD / 2;
    ghostGroup.add(zCyl(r, r, P.slotH - 1, z));
    ghostGroup.add(zCyl(r - 4, r - 4, 1, z + P.slotH - 1, glowMat));
    ghostGroup.add(zCyl(1.6, 1.6, z + 1, -1));
    lightZ = z + 30;
  }
  // hardware stand-ins are closed shapes too: give them solid cut faces in the cutaway (caps ride along as children)
  for (const m of [...ghostGroup.children]) if (m.isMesh) addCap(m, m.geometry, m.material === glowMat ? capGlowMat : capHwMat);
  bulbLight.position.set(0, 0, lightZ ?? S.zEnd / 2);
  applyLight();

  // checks
  const pr = PRINTERS[P.printer];
  const shadeW = 2 * S.maxR, shadeH = S.zEnd;
  const dens = P.material === 'PETG' ? 1.27 : 1.24;
  const shadeG = (meshVolume(S.pos, S.idx) + connVol) / 1000 * dens;
  const checks = [];
  checks.push([ov.badPct < 0.5, ov.badPct < 0.5 ? `Prints without supports (max overhang ${ov.maxOver.toFixed(0)}° ≤ ${P.overhang}°)` : `${ov.badPct.toFixed(1)}% of the wall is steeper than ${P.overhang}° (shown red)`]);
  const fits = shadeW <= Math.min(pr.x, pr.y) && shadeH <= pr.z;
  checks.push([fits, fits ? `Shade fits the ${pr.label.split(' (')[0]} bed` : `Shade ${shadeW.toFixed(0)} × ${shadeH.toFixed(0)} mm exceeds the ${pr.label}`]);
  if (P.mount === 'ring') {
    const minIn = Math.min(...S.rIn0);
    checks.push([minIn > P.holeD / 2 + P.hubW + 2, minIn > P.holeD / 2 + P.hubW + 2 ? `Socket ring Ø${P.holeD} mm fits inside the shade opening` : `Shade opening too small for a Ø${P.holeD} mm ring + hub`]);
  }
  if (twist) {
    if (B.insert === 'puck') {
      const okP = P.puckD / 2 + B.c <= B.boreR - 1;
      checks.push([okP, okP ? `Puck Ø${P.puckD} fits under the Ø${P.collarD} collar` : `Puck Ø${P.puckD} is wider than the collar bore — raise collar Ø to ≥ ${Math.ceil(P.puckD + 2 * B.c + 2 - 2 * P.collarWall)}`]);
    } else if (B.insert === 'slot') {
      const need = P.slotH + 2 * B.c;
      checks.push([P.slotW >= need, P.slotW >= need ? `${P.slotD} × ${P.slotW} mm slot lets the ${P.slotH} mm puck through edgewise` : `Puck is ${P.slotH} mm thick — widen the slot to ≥ ${need.toFixed(1)} mm`]);
      const okC = P.slotD + 2 * B.c + 8 <= P.collarD;
      checks.push([okC, okC ? `Puck Ø${P.slotD} sits inside the Ø${P.collarD} collar` : `Collar Ø${P.collarD} is too tight around the Ø${P.slotD} puck`]);
    } else {
      const okH = P.holeD < P.collarD - 4;
      checks.push([okH, okH ? `Socket Ø${P.holeD} sits inside the Ø${P.collarD} collar` : `Collar Ø${P.collarD} is too small for the Ø${P.holeD} socket`]);
    }
    if (P.turn < P.lugW * 0.6) checks.push([false, 'Turn angle is small for the lug width — the lock may slip']);
  }
  if (lightZ !== null && (P.mount === 'ring' || (twist && B.insert === 'socket'))) {
    // bulb clearance: shade inner radius around the bulb height (assembly coords)
    const off = twist ? B.f : 0;
    let minR = 1e9;
    for (let i = 0; i < S.M; i++) { const z = S.rowZ[i] + off; if (Math.abs(z - lightZ) < fit.bulbR) minR = Math.min(minR, S.rowMinIn[i]); }
    const okB = minR > fit.bulbR + 15;
    checks.push([okB, okB ? 'Bulb clearance OK — use LED bulbs only' : `Shade comes within ${Math.max(0, minR - fit.bulbR).toFixed(0)} mm of the bulb — LED only, keep ≥ 15 mm`]);
  }
  renderChecks(checks);

  const parts = [`Shade Ø${shadeW.toFixed(0)} × ${shadeH.toFixed(0)} mm · ≈${shadeG.toFixed(0)} g ${P.material}`];
  if (baseBox) parts.push(`${B.adapter ? 'Adapter' : 'Base'} Ø${(2 * Math.max(B.Rt, B.Rb)).toFixed(0)} × ${B.H.toFixed(0)} mm · ≈${(baseVol / 1000 * dens).toFixed(0)} g`);
  document.getElementById('dims').innerHTML = parts.join('<br>');
  document.getElementById('expBase').hidden = !twist;
  document.getElementById('expBase').textContent = B.adapter ? 'Export adapter STL' : 'Export base STL';
  document.getElementById('tbExplode').hidden = !twist;
  document.getElementById('tbBase').hidden = !twist;

  // floor + framing
  root.updateMatrixWorld(true);
  const bb = new THREE.Box3().setFromObject(assembly);
  const size = bb.getSize(new THREE.Vector3()), ctr = bb.getCenter(new THREE.Vector3());
  floor.position.set(ctr.x, bb.min.y - 0.5, ctr.z); floor.scale.setScalar(Math.max(size.x, size.z) * 0.75);
  keyLight.target.position.copy(ctr);
  if (firstFrame) { frame(bb); firstFrame = false; }
  lastStats = { bb };
  drawProfile();
  updateTitle();
  scheduleHistory();
  save();
}

// ---------------------------------------------------------------- undo / redo
// Snapshots of the design (user values) taken ~0.4 s after changes settle, so a slider drag is one step.
let hist = [], hi = -1, histT = 0;
function resetHistory() { clearTimeout(histT); hist = [designJSON()]; hi = 0; updateUndoButtons(); }
function commitHistory() {
  clearTimeout(histT);
  const s = designJSON();
  if (hi >= 0 && s === hist[hi]) return;
  hist = hist.slice(0, hi + 1); hist.push(s);
  if (hist.length > 200) hist.shift();
  hi = hist.length - 1; updateUndoButtons();
}
function scheduleHistory() { if (hi < 0) return resetHistory(); clearTimeout(histT); histT = setTimeout(commitHistory, 400); }
function restoreHistory(i) {
  hi = i; P = merge(clone(DEFAULT), JSON.parse(hist[hi])); initIntent();
  refreshAll(); invalidate(); updateUndoButtons();
}
function undo() { commitHistory(); if (hi > 0) restoreHistory(hi - 1); }
function redo() { commitHistory(); if (hi < hist.length - 1) restoreHistory(hi + 1); }
function updateUndoButtons() {
  document.getElementById('fUndo').disabled = hi <= 0;
  document.getElementById('fRedo').disabled = hi >= hist.length - 1;
}
function frame(bb) {
  const size = bb.getSize(new THREE.Vector3()), ctr = bb.getCenter(new THREE.Vector3());
  const r = size.length() / 2;
  const dist = r / Math.sin(camera.fov * DEG / 2) * 1.05;
  controls.target.copy(ctr);
  camera.position.set(ctr.x + dist * 0.55, ctr.y + dist * 0.35, ctr.z + dist * 0.76);
  camera.near = dist / 50; camera.far = dist * 20; camera.updateProjectionMatrix();
}
function applyLight() {
  const on = view3.light;
  renderer.toneMappingExposure = on ? 0.8 : 1;
  scene.environmentIntensity = on ? 0.06 : 1;
  keyLight.intensity = on ? 0.05 : 1.2;
  shadeMat.emissiveIntensity = connMat.emissiveIntensity = on ? 0.7 : 0;
  glowMat.emissiveIntensity = on ? 2.5 : 0;
  bulbLight.intensity = on ? 60000 : 0;
  applyCut();
}

let pending = false;
function invalidate() { if (pending) return; pending = true; requestAnimationFrame(() => { pending = false; try { update(); } catch (e) { console.error(e); toast('Could not rebuild the model: ' + e.message); } }); }

let saveT = 0;
function save() { clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem('lampstudio', designJSON()); localStorage.setItem('illum.current', JSON.stringify(cur)); } catch (e) { /* storage unavailable */ } }, 400); }

function renderChecks(list) {
  document.getElementById('checks').innerHTML = list.map(([ok, txt]) => `<li class="${ok ? 'ok' : 'bad'}"><b>${ok ? '✓' : '!'}</b><span>${txt}</span></li>`).join('');
}

// ---------------------------------------------------------------- profile editor
const pc = document.createElement('canvas'); pc.id = 'profileCanvas';
const pctx = pc.getContext('2d');
let drag = -1;
function profMap() {
  const w = pc.clientWidth, h = pc.clientHeight;
  const sc = Math.min((w / 2 - 14) / 165, (h - 30) / P.height);
  return { w, h, sc, cx: w / 2, by: h - 16 };
}
function drawProfile() {
  if (!pc.isConnected) return;
  const dpr = devicePixelRatio || 1, { w, h, sc, cx, by } = profMap();
  if (pc.width !== Math.round(w * dpr)) { pc.width = Math.round(w * dpr); pc.height = Math.round(h * dpr); }
  const ctx = pctx; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
  const cs = getComputedStyle(document.documentElement);
  const line = cs.getPropertyValue('--line'), muted = cs.getPropertyValue('--muted'), acc = cs.getPropertyValue('--accent'), warn = cs.getPropertyValue('--warn');
  ctx.strokeStyle = line; ctx.lineWidth = 1;
  for (let r = 0; r <= 160; r += 20) { for (const s of [1, -1]) { ctx.beginPath(); ctx.moveTo(cx + s * r * sc, by); ctx.lineTo(cx + s * r * sc, by - P.height * sc); ctx.stroke(); } }
  for (let z = 0; z <= P.height; z += 20) { ctx.beginPath(); ctx.moveTo(cx - 160 * sc, by - z * sc); ctx.lineTo(cx + 160 * sc, by - z * sc); ctx.stroke(); }
  const prof = buildProfile(), n = prof.length - 1, Wd = P.width;
  const X = (r, s = 1) => cx + s * r * Wd * sc, Y = t => by - t * P.height * sc;
  ctx.beginPath();
  for (let i = 0; i <= n; i++) ctx.lineTo(X(prof[i]), Y(i / n));
  for (let i = n; i >= 0; i--) ctx.lineTo(X(prof[i], -1), Y(i / n));
  ctx.closePath(); ctx.fillStyle = acc; ctx.globalAlpha = 0.12; ctx.fill(); ctx.globalAlpha = 1;
  const lim = Math.tan(P.overhang * DEG);
  ctx.lineWidth = 2;
  for (const s of [1, -1]) for (let i = 0; i < n; i++) {
    const slope = Math.abs(prof[i + 1] - prof[i]) * Wd / (P.height / n);
    ctx.strokeStyle = slope > lim ? warn : acc;
    ctx.beginPath(); ctx.moveTo(X(prof[i], s), Y(i / n)); ctx.lineTo(X(prof[i + 1], s), Y((i + 1) / n)); ctx.stroke();
  }
  ctx.setLineDash([3, 3]); ctx.strokeStyle = muted; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(cx, by + 4); ctx.lineTo(cx, by - P.height * sc - 4); ctx.stroke(); ctx.setLineDash([]);
  for (const [t, r] of P.profile) {
    ctx.beginPath(); ctx.arc(X(r), Y(t), 5.5, 0, TAU); ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = acc; ctx.lineWidth = 2; ctx.stroke();
  }
  ctx.fillStyle = muted; ctx.font = '11px -apple-system, sans-serif';
  const conn = P.orient === 'pendant' ? 1 : 0;
  ctx.fillText(P.mount === 'none' ? '' : '◆ connector end', 8, Y(conn) + (conn ? 12 : -4));
  ctx.textAlign = 'right';
  ctx.fillText(`Ø ${(prof[0] * 2 * Wd).toFixed(0)} bottom · Ø ${(prof[n] * 2 * Wd).toFixed(0)} top · ${P.height} mm`, w - 8, 14);
  ctx.textAlign = 'left';
}
function pickPoint(e) {
  const r = pc.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top, { sc, cx, by } = profMap();
  let best = -1, bd = 12;
  P.profile.forEach(([t, rr], i) => { const d = Math.hypot(Math.abs(x - cx) - rr * P.width * sc, y - (by - t * P.height * sc)); if (d < bd) { bd = d; best = i; } });
  return { best, x, y, sc, cx, by };
}
pc.addEventListener('pointerdown', e => { if (e.button !== 0) return; const p = pickPoint(e); if (p.best >= 0) { drag = p.best; pc.setPointerCapture(e.pointerId); } });
pc.addEventListener('pointermove', e => {
  if (drag < 0) return;
  P.profile.sort((a, b) => a[0] - b[0]);
  const { x, y, sc, cx, by } = pickPoint(e);
  const pts = P.profile, last = pts.length - 1;
  const r = Math.min(160, Math.max(8, Math.abs(x - cx) / sc / P.width));
  let t = (by - y) / (P.height * sc);
  if (drag === 0) t = 0; else if (drag === last) t = 1;
  else t = Math.min(pts[drag + 1][0] - 0.02, Math.max(pts[drag - 1][0] + 0.02, t));
  pts[drag] = [t, r];
  invalidate();
});
pc.addEventListener('pointerup', () => { drag = -1; });
pc.addEventListener('dblclick', e => {
  const { best, x, y, sc, cx, by } = pickPoint(e);
  if (best >= 0) return;
  const t = (by - y) / (P.height * sc);
  if (t <= 0.02 || t >= 0.98) return;
  P.profile.push([t, Math.min(160, Math.max(8, Math.abs(x - cx) / sc / P.width))]);
  P.profile.sort((a, b) => a[0] - b[0]);
  invalidate();
});
pc.addEventListener('contextmenu', e => {
  e.preventDefault();
  const { best } = pickPoint(e);
  P.profile.sort((a, b) => a[0] - b[0]);
  if (best > 0 && best < P.profile.length - 1) { P.profile.splice(best, 1); invalidate(); }
});

// ---------------------------------------------------------------- controls
const controlsList = [];
let importInput = null;   // hidden file input for .json import (created in the Print tab)
function reg(el, when, sync) { controlsList.push({ el, when, sync }); return el; }
function refreshAll() { for (const c of controlsList) { if (c.when) c.el.hidden = !c.when(); c.sync?.(); } }
function changed(key, v, structural) { setK(key, v); if (intent && key in LIMITS) intent[key] = v; sideEffects(key); if (structural) refreshAll(); invalidate(); }

function h3(parent, text, when) { const e = document.createElement('h3'); e.textContent = text; parent.append(e); return reg(e, when); }
function note(parent, text, when) { const e = document.createElement('div'); e.className = 'note'; e.innerHTML = text; parent.append(e); return reg(e, when); }
function slider(parent, label, key, min, max, step, unit = '', when) {
  const row = document.createElement('div'); row.className = 'ctl';
  row.innerHTML = `<label>${label}</label><input type="range" min="${min}" max="${max}" step="${step}"><input type="number" min="${min}" max="${max}" step="${step}">`;
  const [rg, nb] = row.querySelectorAll('input'), lab = row.querySelector('label');
  const sync = () => {
    const v = getK(key), lim = LIMITS[key]?.();
    if (lim) {
      const lo = Math.max(min, lim[0]), hi = Math.max(lo, lim[1]);
      rg.min = nb.min = lo; rg.max = nb.max = hi;
      const atMin = lim[0] > min && v <= lo + 0.01, atMax = lim[1] < max && v >= hi - 0.01;
      const tip = (atMin ? 'At its minimum: ' : atMax ? 'At its maximum: ' : 'Limited because ') + lim[2];
      const tags = [lim[0] > min ? `min ${fmt(lo)}` : '', atMax ? `max ${fmt(hi)}` : ''].filter(Boolean).join(' · ');
      lab.textContent = label;
      if (tags) {
        const sm = document.createElement('small'); sm.className = 'lim'; sm.dataset.tip = tip; sm.textContent = tags;
        if (atMin || atMax) { const b = document.createElement('b'); b.className = 'warn'; b.textContent = '!'; sm.append(b); }
        lab.append(sm);
      }
    }
    rg.value = v; nb.value = +(+v).toFixed(2);
  };
  rg.addEventListener('input', () => { nb.value = rg.value; changed(key, +rg.value); });
  nb.addEventListener('change', () => { const v = +nb.value; if (!Number.isFinite(v)) return sync(); rg.value = v; changed(key, v); });
  parent.append(row); sync();
  return reg(row, when, sync);
}
function select(parent, label, key, options, when) {
  const row = document.createElement('div'); row.className = 'ctl wide';
  row.innerHTML = `<label>${label}</label><select>${Object.entries(options).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select>`;
  const s = row.querySelector('select');
  const sync = () => { s.value = getK(key); };
  s.addEventListener('change', () => changed(key, s.value, true));
  parent.append(row); sync();
  return reg(row, when, sync);
}
function segmented(parent, label, key, options, when) {
  const row = document.createElement('div'); row.className = 'ctl wide';
  row.innerHTML = `<label>${label}</label><div class="seg">${Object.entries(options).map(([k, v]) => `<button data-v="${k}">${v}</button>`).join('')}</div>`;
  const bs = [...row.querySelectorAll('button')];
  const sync = () => bs.forEach(b => b.classList.toggle('on', b.dataset.v === String(getK(key))));
  bs.forEach(b => b.addEventListener('click', () => changed(key, b.dataset.v, true)));
  parent.append(row); sync();
  return reg(row, when, sync);
}
function toggleRow(parent, label, key, when) {
  const row = document.createElement('div'); row.className = 'ctl wide';
  row.innerHTML = `<label>${label}</label><div><label class="switch"><input type="checkbox"><span></span></label></div>`;
  const cb = row.querySelector('input');
  const sync = () => { cb.checked = !!getK(key); };
  cb.addEventListener('change', () => changed(key, cb.checked, true));
  parent.append(row); sync();
  return reg(row, when, sync);
}
function colorRow(parent, label, key) {
  const row = document.createElement('div'); row.className = 'ctl wide';

}
function card(parent, title, key, when) {
  const el = document.createElement('div'); el.className = 'card';
  el.innerHTML = `<div class="cardhead"><span>${title}</span>${key ? '<label class="switch"><input type="checkbox"><span></span></label>' : ''}</div>`;

function randomize() {
  const pick = a => a[Math.floor(Math.random() * a.length)], rr = (a, b) => a + Math.random() * (b - a);
  P.profile = clone(PROFILES[pick(Object.keys(PROFILES))]).map(([t, r]) => [t, Math.max(30, r * rr(0.85, 1.15))]);
  P.height = Math.round(rr(120, 200));
  P.sides = Math.random() < 0.3 ? Math.round(rr(4, 9)) : 0; P.round = rr(0.1, 0.6);
  P.twist = Math.random() < 0.4 ? Math.round(rr(-120, 120)) : 0;
  for (const k in P.pat) P.pat[k].on = false;
  const choices = Object.keys(P.pat), first = pick(choices);
  P.pat[first].on = true;
  if (Math.random() < 0.35) P.pat[pick(choices)].on = true;
  const pt = P.pat;
  pt.ribs.count = Math.round(rr(12, 60)); pt.ribs.sharp = rr(0.6, 4); pt.ribs.depth = rr(1, 3.5);
  pt.spiral.count = Math.round(rr(10, 48)); pt.spiral.turns = rr(-1, 1); pt.spiral.depth = rr(1, 3.5);
  pt.rings.count = rr(8, 40); pt.wavy.count = rr(6, 24); pt.wavy.waves = Math.round(rr(3, 10)); pt.wavy.amp = rr(0.5, 3);
  pt.diamond.count = Math.round(rr(10, 30)); pt.diamond.rows = rr(5, 16);
  pt.bubbles.count = Math.round(rr(10, 26)); pt.noise.seed = Math.round(rr(1, 99)); pt.noise.scale = rr(10, 40);
  refreshAll(); invalidate();
}

const isDirty = () => designJSON() !== cur.snap;
function loadProjects() { try { return JSON.parse(localStorage.getItem('illum.projects')) || []; } catch (e) { return []; } }
function storeProjects(list) {
  try { localStorage.setItem('illum.projects', JSON.stringify(list)); return true; }
  catch (e) { alert('Could not save: browser storage is full. Export some projects as .json, then delete them here.'); return false; }
}
function persistCur() { try { localStorage.setItem('illum.current', JSON.stringify(cur)); } catch (e) { /* storage unavailable */ } }
function updateTitle() {
  const d = isDirty();
  document.getElementById('projName').textContent = cur.name;
  document.getElementById('projDirty').classList.toggle('on', d);
  document.title = (d ? '• ' : '') + cur.name + ' — Illuminate3D';
}
let toastT = 0;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1800); }
function thumbnail() {
  update();   // a rebuild may still be queued (e.g. right after New/Open)
  renderer.render(scene, camera);
  const src = renderer.domElement, c = document.createElement('canvas'), w = 240, h = 180;
  c.width = w; c.height = h;
  const x = c.getContext('2d'); x.fillStyle = '#1c1c1e'; x.fillRect(0, 0, w, h);
  const sc = Math.max(w / src.width, h / src.height);
  x.drawImage(src, (w - src.width * sc) / 2, (h - src.height * sc) / 2, src.width * sc, src.height * sc);
  return c.toDataURL('image/jpeg', 0.8);
}
function confirmDiscard() { return !isDirty() || confirm(`Discard unsaved changes to “${cur.name}”?`); }
function loadDesign(data, meta) {
  P = merge(clone(DEFAULT), clone(data));
  initIntent();
  cur = { id: null, name: 'Untitled lamp', ...meta, snap: designJSON() };
  resetHistory();
  persistCur(); refreshAll(); firstFrame = true; invalidate();
}
function saveProject(asNew) {
  let name = cur.name;
  if (asNew || !cur.id) {
    const n = prompt('Project name', asNew && cur.id ? cur.name + ' copy' : cur.name);
    if (n === null) return;
    name = n.trim() || 'Untitled lamp';
  }
  const id = asNew || !cur.id ? 'p' + Date.now().toString(36) : cur.id;
  const list = loadProjects(), entry = { id, name, updated: Date.now(), thumb: thumbnail(), data: designState() };
  const i = list.findIndex(q => q.id === id);
  if (i >= 0) list[i] = entry; else list.unshift(entry);
  if (!storeProjects(list)) return;
  cur = { id, name, snap: designJSON() };
  persistCur(); updateTitle(); toast(`Saved “${name}”`);
}
function exportJSON(name, data) {
  const file = (name || 'lamp').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-').toLowerCase() || 'lamp';
  download(new Blob([JSON.stringify({ app: 'Illuminate3D', version: 1, name, data }, null, 1)], { type: 'application/json' }), file + '.json');
}
async function importJSON(f) {
  if (!f || !confirmDiscard()) return;
  try {
    const j = JSON.parse(await f.text());
    const data = j.app === 'Illuminate3D' ? j.data : j;
    loadDesign(data, { id: null, name: j.name || f.name.replace(/\.json$/i, '') });
    cur.snap = null; persistCur(); updateTitle();
    closeProjects(); toast('Imported — press Save to keep it in your projects');
  } catch (e) { alert('Could not read that design file.'); }
}
function renderProjects() {
  const grid = document.getElementById('projGrid'), list = loadProjects().sort((a, b) => b.updated - a.updated);
  grid.innerHTML = list.length ? '' : '<div class="pempty">No saved projects yet. Press Save to keep the current design here.</div>';
  for (const q of list) {
    const el = document.createElement('div'); el.className = 'pcard' + (q.id === cur.id ? ' cur' : '');
    el.innerHTML = `<img alt=""><div class="pmeta"><div class="pname"></div><div class="pdate"></div></div><div class="pact"><button data-a="open">Open</button><button data-a="rename">Rename</button><button data-a="export">Export</button><button data-a="delete">Delete</button></div>`;
    el.querySelector('img').src = q.thumb || '';
    el.querySelector('.pname').textContent = q.name;
    el.querySelector('.pdate').textContent = new Date(q.updated).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) + (q.id === cur.id ? ' · open now' : '');
    const act = a => {
      const all = loadProjects(), it = all.find(x => x.id === q.id);
      if (!it) return renderProjects();

}
function openProjects() { renderProjects(); document.getElementById('modal').hidden = false; }

document.getElementById('fNew').onclick = () => { if (confirmDiscard()) { loadDesign(DEFAULT, { id: null, name: 'Untitled lamp' }); toast('New design'); } };
document.getElementById('fOpen').onclick = openProjects;
document.getElementById('fSave').onclick = () => saveProject(false);
document.getElementById('fSaveAs').onclick = () => saveProject(true);
document.getElementById('projName').onclick = () => {
  const n = prompt('Project name', cur.name);
  if (!n || !n.trim()) return;
  cur.name = n.trim();
  if (cur.id) { const all = loadProjects(), it = all.find(x => x.id === cur.id); if (it) { it.name = cur.name; storeProjects(all); } }

};
document.getElementById('mClose').onclick = closeProjects;
document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeProjects(); });
document.getElementById('mImport').onclick = () => importInput.click();
addEventListener('keydown', e => {
  if (e.key === 'Escape') closeProjects();
  if (!(e.metaKey || e.ctrlKey)) return;
  const k = e.key.toLowerCase();
  if (k === 's') { e.preventDefault(); saveProject(e.shiftKey); }
  if (k === 'o') { e.preventDefault(); openProjects(); }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName) && document.activeElement.type !== 'range';

document.getElementById('fUndo').onclick = undo;
// hover (or tap) a "min …" tag to see why the limit is there
const tipbox = document.getElementById('tipbox');
function showTip(el) {
  tipbox.textContent = el.dataset.tip; tipbox.style.display = 'block';
  const r = el.getBoundingClientRect(), w = tipbox.offsetWidth;
  tipbox.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left)) + 'px';
  tipbox.style.top = (r.bottom + 6) + 'px';

document.addEventListener('mouseover', e => { const el = e.target.closest?.('[data-tip]'); if (el) showTip(el); });

document.getElementById('fRedo').onclick = redo;

// ---------------------------------------------------------------- export
function download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
function stlBlob(mesh) {
  const v = mesh.vertProperties, t = mesh.triVerts, np = mesh.numProp, nt = t.length / 3;
  const buf = new ArrayBuffer(84 + 50 * nt), dv = new DataView(buf);
  new Uint8Array(buf, 0, 80).set(new TextEncoder().encode('Illuminate3D STL'));
  dv.setUint32(80, nt, true);
  let o = 84;
  for (let i = 0; i < nt; i++) {
    const a = t[i * 3] * np, b = t[i * 3 + 1] * np, c = t[i * 3 + 2] * np;
    const ux = v[b] - v[a], uy = v[b + 1] - v[a + 1], uz = v[b + 2] - v[a + 2], wx = v[c] - v[a], wy = v[c + 1] - v[a + 1], wz = v[c + 2] - v[a + 2];
    let nx = uy * wz - uz * wy, ny = uz * wx - ux * wz, nz = ux * wy - uy * wx; const l = Math.hypot(nx, ny, nz) || 1;
    dv.setFloat32(o, nx / l, true); dv.setFloat32(o + 4, ny / l, true); dv.setFloat32(o + 8, nz / l, true); o += 12;
    for (const k of [a, b, c]) { dv.setFloat32(o, v[k], true); dv.setFloat32(o + 4, v[k + 1], true); dv.setFloat32(o + 8, v[k + 2], true); o += 12; }
    o += 2;
  }

}
const QUALITY = { standard: { n: 240, layer: 0.8, seg: 128 }, fine: { n: 360, layer: 0.5, seg: 192 }, ultra: { n: 540, layer: 0.3, seg: 256 } };
const busy = document.getElementById('busy');
async function runExport(which) {
  if (!W) return;

  await new Promise(r => setTimeout(r, 30));

    const q = QUALITY[P.exportQ];
    const blob = gcScope(() => {
      let man;
      if (which === 'shade') {
        const S = buildShade(q.n, q.layer);
        const body = keep(new W.Manifold(new W.Mesh({ numProp: 3, vertProperties: S.pos, triVerts: S.idx })));
        const conn = shadeConnector(S, q.seg);
        man = conn ? keep(body.add(conn)) : body;

}
document.getElementById('expShade').onclick = () => runExport('shade');
document.getElementById('expBase').onclick = () => runExport('base');

refreshAll();
document.getElementById('tbOver').classList.toggle('on', view3.over);
busy.classList.add('on');
update();
Module().then(m => { m.setup(); W = m; busy.classList.remove('on'); invalidate(); })
  .catch(e => { console.error(e); busy.textContent = 'Could not load the geometry engine — serve this folder over http (see README).'; });
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('./sw.js').catch(e => console.warn('Offline mode unavailable', e));
window.__lamp = { get P() { return P; }, get W() { return W; }, update, baseDims, buildShade, shadeConnector, buildBase, gcScope };
