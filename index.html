<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Illuminate3D</title>
<meta name="description" content="Design 3D-printable lampshades with twist-lock, socket and LED puck connectors.">
<meta name="theme-color" content="#1f1f21">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Illuminate3D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root {
  --bg: #f4f3f0; --panel: #ffffff; --panel-2: #f7f6f3; --line: #e3e1dc; --text: #1d1d1f; --muted: #6e6e73;
  --accent: #d9822b; --accent-soft: rgba(217,130,43,.14); --ok: #2f9e55; --warn: #d7462e; --view: radial-gradient(ellipse at 50% 35%, #ffffff 0%, #e9e7e2 70%);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161617; --panel: #1f1f21; --panel-2: #262628; --line: #333336; --text: #f2f2f4; --muted: #9a9aa0;
    --accent: #f0a050; --accent-soft: rgba(240,160,80,.16); --ok: #4cc27a; --warn: #ff6b55; --view: radial-gradient(ellipse at 50% 35%, #2c2c2f 0%, #141415 75%);
  }
}
:root[data-theme="dark"] {
  --bg: #161617; --panel: #1f1f21; --panel-2: #262628; --line: #333336; --text: #f2f2f4; --muted: #9a9aa0;
  --accent: #f0a050; --accent-soft: rgba(240,160,80,.16); --ok: #4cc27a; --warn: #ff6b55; --view: radial-gradient(ellipse at 50% 35%, #2c2c2f 0%, #141415 75%);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; }
#app { display: grid; grid-template-columns: 384px 1fr; height: 100vh; }
aside { display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line); min-height: 0; }
header { padding: 14px 16px 10px; display: flex; align-items: baseline; gap: 8px; }
header h1 { font-size: 16px; font-weight: 700; margin: 0; letter-spacing: -.02em; }
#projName { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px; padding: 2px 6px; border-radius: 6px; cursor: text; max-width: 210px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#projName:hover { background: var(--panel-2); color: var(--text); }
#projDirty { color: var(--accent); font-size: 10px; visibility: hidden; }
#projDirty.on { visibility: visible; }
#filebar { display: flex; gap: 4px; padding: 0 12px 10px; }
#filebar button { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid transparent; background: transparent; color: var(--muted); border-radius: 8px; padding: 6px 0; font: inherit; font-size: 12.5px; font-weight: 500; letter-spacing: -.005em; cursor: pointer; white-space: nowrap; }
#filebar button:hover { background: var(--panel-2); color: var(--text); border-color: var(--line); }
#filebar button svg, nav button svg { flex: none; opacity: .9; }
#filebar button.icon { flex: 0 0 34px; display: grid; place-items: center; }
#filebar button:disabled { opacity: .35; cursor: default; border-color: var(--line); }
#toast { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 14px; font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; }
#toast.on { opacity: 1; }
#modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; z-index: 10; padding: 16px; }
#modal[hidden] { display: none; }
.sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; width: min(860px, 100%); max-height: 86vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
.sheethead, .sheetfoot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; }
.sheethead h2 { margin: 0; font-size: 16px; }
.sheetfoot { border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; justify-content: flex-start; }
#projGrid { overflow-y: auto; padding: 4px 16px 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.pcard { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel-2); }
.pcard.cur { border-color: var(--accent); }
.pcard img { display: block; width: 100%; aspect-ratio: 4/3; object-fit: cover; background: #1c1c1e; cursor: pointer; }
.pcard .pmeta { padding: 8px 10px 4px; }
.pcard .pname { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pcard .pdate { color: var(--muted); font-size: 11px; }
.pcard .pact { display: flex; gap: 4px; padding: 6px 8px 8px; }
.pcard .pact button { flex: 1; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 11px; padding: 4px 0; border-radius: 5px; cursor: pointer; }
.pcard .pact button:hover { background: var(--panel); color: var(--text); }
.pempty { grid-column: 1 / -1; color: var(--muted); text-align: center; padding: 40px 0; }
nav { display: flex; gap: 4px; padding: 0 12px 10px; border-bottom: 1px solid var(--line); }
nav button { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; background: transparent; color: var(--muted); padding: 7px 0; border-radius: 8px; font: inherit; font-size: 12.5px; font-weight: 600; letter-spacing: -.005em; cursor: pointer; white-space: nowrap; }
nav button:hover:not(.on) { background: var(--panel-2); color: var(--text); }
nav button.on { background: var(--accent-soft); color: var(--accent); }
#panels { flex: 1; overflow-y: auto; padding: 4px 16px 16px; min-height: 0; }
.panel { display: none; } .panel.on { display: block; }
h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 8px; font-weight: 700; }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px 4px; margin: 8px 0; background: var(--panel-2); }
.card > .cardhead { display: flex; align-items: center; justify-content: space-between; font-weight: 600; padding-bottom: 4px; }
.card.off > .ctl { display: none; }
.ctl { display: grid; grid-template-columns: 112px 1fr 62px; align-items: center; gap: 8px; margin: 6px 0; }
.ctl.wide { grid-template-columns: 112px 1fr; }
.ctl label { color: var(--muted); font-size: 12px; }
.ctl .lim { display: block; font-size: 10px; color: var(--accent); }
.ctl .lim { cursor: help; }
.ctl .lim .warn { display: inline-grid; place-items: center; width: 13px; height: 13px; margin-left: 4px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 9px; font-weight: 800; vertical-align: 1px; }
#tipbox { position: fixed; z-index: 30; max-width: 300px; padding: 8px 10px; border-radius: 8px; background: var(--panel); color: var(--text); border: 1px solid var(--line); box-shadow: 0 8px 24px rgba(0,0,0,.25); font-size: 12px; line-height: 1.4; pointer-events: none; display: none; }
.ctl[hidden], .card[hidden], h3[hidden] { display: none !important; }
.panel h3 { cursor: pointer; user-select: none; display: flex; align-items: center; gap: 0; }
.panel h3::before { content: ''; width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 5px solid currentColor; margin-right: 7px; transition: transform .15s; flex: none; }
.panel h3.collapsed::before { transform: rotate(-90deg); }
.panel h3:hover { color: var(--text); }
.grpbody.collapsed { display: none; }
.presetrow { display: flex; gap: 6px; align-items: center; }
.presetrow select { flex: 1; min-width: 0; }
.presetrow button { flex: none; padding: 4px 6px; display: grid; place-items: center; }
.presetrow button:disabled { opacity: .35; cursor: default; }
input[type=range] { width: 100%; accent-color: var(--accent); }
input[type=number], select { width: 100%; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; font: inherit; }
input[type=number] { text-align: right; padding-right: 4px; }
.seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 2px; gap: 2px; }
.seg button { flex: 1; border: 0; background: transparent; color: var(--muted); padding: 4px 2px; border-radius: 5px; font: inherit; font-size: 12px; cursor: pointer; }
.seg button.on { background: var(--accent); color: #fff; }
.switch { display: block; position: relative; width: 34px; height: 20px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; background: var(--line); border-radius: 20px; transition: .15s; cursor: pointer; }
.switch span::after { content: ""; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; background: #fff; border-radius: 50%; transition: .15s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(14px); }
.presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.btn { border: 1px solid var(--line); background: var(--panel-2); color: var(--text); border-radius: 7px; padding: 6px 8px; font: inherit; font-size: 12px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn:disabled { opacity: .5; cursor: default; }
#profileWrap { border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); margin-top: 10px; }
#profileCanvas { width: 100%; height: 250px; display: block; touch-action: none; cursor: crosshair; }
.hint { color: var(--muted); font-size: 11px; padding: 0 10px 8px; }
.note { color: var(--muted); font-size: 12px; margin: 6px 0; }
footer { border-top: 1px solid var(--line); padding: 10px 16px 14px; }
#checks { list-style: none; margin: 0 0 10px; padding: 0; font-size: 12px; }
#checks li { display: flex; gap: 6px; padding: 2px 0; }
#checks li b { width: 14px; flex: none; }
#checks li.ok b { color: var(--ok); } #checks li.bad b { color: var(--warn); }
.exports { display: flex; flex-direction: column; gap: 6px; } .exports .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 9px 8px; }
.exprow { display: flex; gap: 6px; } .exprow .btn { flex: 1; padding: 7px 6px; } .exports .btn[hidden] { display: none; }
main { position: relative; background: var(--view); min-width: 0; }
main canvas { display: block; width: 100%; height: 100%; }
#toolbar { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
#toolbar button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; color: var(--muted); padding: 6px 10px; border-radius: 7px; font: inherit; font-size: 12px; cursor: pointer; white-space: nowrap; }
#toolbar button:hover:not(:disabled) { background: var(--panel-2); color: var(--text); }
#toolbar button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
#toolbar button.icon { padding: 6px 7px; }
#toolbar button:disabled { opacity: .35; cursor: default; }
#toolbar button svg { flex: none; }
#toolbar button[hidden] { display: none; }
@media (max-width: 1320px) { #toolbar button span { display: none; } #toolbar button { padding: 6px 8px; } }
#viewpad { position: absolute; right: 14px; bottom: 12px; display: grid; grid-template-areas: ". t . i" "l f r k" ". b . ."; grid-template-columns: repeat(4, 46px); gap: 3px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
#viewpad button { border: 0; background: var(--panel-2); color: var(--muted); font: inherit; font-size: 10.5px; padding: 4px 0; border-radius: 6px; cursor: pointer; display: grid; place-items: center; }
#viewpad button:hover { color: var(--accent); background: var(--accent-soft); }
.info { display: inline-grid; place-items: center; width: 14px; height: 14px; margin-left: 5px; border-radius: 50%; border: 1px solid currentColor; color: var(--muted); font: italic 700 9px/1 Georgia, serif; vertical-align: 1px; cursor: help; text-transform: none; letter-spacing: 0; opacity: .8; }
.info:hover { color: var(--accent); opacity: 1; }
.info[hidden] { display: none; }
.tbsep { width: 1px; background: var(--line); margin: 4px 2px; }
#dims { position: absolute; left: 14px; bottom: 12px; color: var(--muted); font-size: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
#busy { position: absolute; inset: 0; display: none; place-items: center; background: rgba(0,0,0,.25); color: #fff; font-weight: 600; font-size: 14px; }
#busy.on { display: grid; }
@media (max-width: 820px) {
  #app { grid-template-columns: 1fr; grid-template-rows: 46vh 1fr; height: auto; min-height: 100vh; }
  main { grid-row: 1; height: 46vh; }
  aside { grid-row: 2; border-right: 0; }
  #panels { overflow: visible; }
  #toolbar { max-width: calc(100% - 32px); overflow-x: auto; }
}
</style>

{ "imports": {
  "three": "./vendor/three/three.module.js",

} }

<body>
<div id="app">
  <aside>
    <header><h1>Illuminate3D</h1><button id="projName" title="Rename project"></button><span id="projDirty" title="Unsaved changes">●</span></header>
    <div id="filebar">
      <button id="fNew" title="Start a new design"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M9 15h6M12 18v-6"/></svg><span>New</span></button>
      <button id="fOpen" title="Open a saved project (⌘O)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></svg><span>Open…</span></button>
      <button id="fSave" title="Save (⌘S)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></svg><span>Save</span></button>
      <button id="fSaveAs" title="Save a copy under a new name"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/><path d="M15 12v6M12 15h6"/></svg><span>Save as…</span></button>
    </div>
    <nav id="tabs">
      <button data-tab="shape" class="on"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2h6"/><path d="M10 2c0 4-4 6-4 11a6 6 0 0 0 12 0c0-5-4-7-4-11"/><path d="M8 22h8"/></svg><span>Shape</span></button>
      <button data-tab="pattern"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/><path d="M2 12c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/><path d="M2 18c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/></svg><span>Pattern</span></button>
      <button data-tab="connector"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-5"/><path d="M9 8V2M15 8V2"/><path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"/></svg><span>Connector</span></button>
      <button data-tab="print"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg><span>Print</span></button>
    </nav>
    <div id="panels">
      <div class="panel on" id="p-shape"></div>
      <div class="panel" id="p-pattern"></div>
      <div class="panel" id="p-connector"></div>
      <div class="panel" id="p-print"></div>
    </div>
    <footer>
      <ul id="checks"></ul>
      <div class="exports">
        <button class="btn primary" id="expPlate" title="All parts laid out side by side on your printer’s bed, oriented for printing, in one STL"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="7" rx="2"/><circle cx="7.5" cy="14" r="2.5"/><rect x="12" y="11" width="7" height="6" rx="1"/><path d="M12 3v4M8 5l4 2 4-2"/></svg><span>Export print plate</span></button>
        <div class="exprow">
          <button class="btn" id="expShade" title="Export the shade on its own"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg><span>Shade</span></button>
          <button class="btn" id="expBase" title="Export the base on its own"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg><span>Base</span></button>
          <button class="btn" id="expCover" title="Export the bottom cover on its own" hidden><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg><span>Cover</span></button>
        </div>
      </div>
    </footer>
  </aside>
  <main id="view">
    <div id="toolbar">
      <button id="fUndo" class="icon" title="Undo (⌘Z)" aria-label="Undo" disabled><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button id="fRedo" class="icon" title="Redo (⇧⌘Z)" aria-label="Redo" disabled><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
      <span class="tbsep"></span>
      <button id="tbShade" class="on" title="Show or hide the shade"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2h8l4 10H4L8 2Z"/><path d="M12 12v6"/><path d="M8 22v-2c0-1.1.9-2 2-2h4a2 2 0 0 1 2 2v2H8Z"/></svg><span>Shade</span></button>
      <button id="tbBase" class="on" title="Show or hide the base"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/></svg><span>Base</span></button>
      <button id="tbHw" class="on" title="Show or hide the socket, bulb or puck"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="16" x="4" y="4" rx="2"/><rect width="6" height="6" x="9" y="9" rx="1"/><path d="M15 2v2M15 20v2M2 15h2M2 9h2M20 15h2M20 9h2M9 2v2M9 20v2"/></svg><span>Hardware</span></button>
      <button id="tbCover" class="on" title="Show or hide the bottom cover" hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/></svg><span>Cover</span></button>

// ---------------------------------------------------------------- shade geometry
function buildProfile() {
  const pts = P.profile.slice().sort((a, b) => a[0] - b[0]);

  for (let s = 0; s <= n; s++) {
    const z = s / n;
    while (s0 < k - 2 && z > pts[s0 + 1][0]) s0++;
    const p0 = pts[s0], p1 = pts[Math.min(s0 + 1, k - 1)];
    const h = Math.max(1e-6, p1[0] - p0[0]);
    const u = Math.min(1, Math.max(0, (z - p0[0]) / h));
    if (P.curve === 'linear') out[s] = p0[1] + (p1[1] - p0[1]) * u;
    else {
      const u2 = u * u, u3 = u2 * u;
      out[s] = (2 * u3 - 3 * u2 + 1) * p0[1] + (u3 - 2 * u2 + u) * h * m[s0] + (-2 * u3 + 3 * u2) * p1[1] + (u3 - u2) * h * m[Math.min(s0 + 1, k - 1)];
    }
  }

    const src = out.slice();
    for (let s = 0; s <= n; s++) {
      let acc = 0, ws = 0;
      for (let i = -rad; i <= rad; i++) { const j = Math.min(n, Math.max(0, s + i)); acc += src[j] * w[i + rad]; ws += w[i + rad]; }
      out[s] = acc / ws;
    }
  }
  for (let s = 0; s <= n; s++) out[s] = Math.max(6, out[s]);

}

function makeShapeF() {
  const n = Math.round(P.sides), ro = P.round, asp = P.aspect;
  const seg = TAU / n, half = Math.PI / n;
  const c = (1 - ro) / Math.cos(half);
  const xt = Math.atan((1 - ro) * Math.tan(half));
  return a => {
    let f = 1;
    if (n >= 3) {
      const x = Math.abs((((a % seg) + seg) % seg) - half);
      if (x <= xt) f = 1 / Math.cos(x);
      else { const d = half - x, sd = Math.sin(d); f = c * Math.cos(d) + Math.sqrt(Math.max(0, ro * ro - c * c * sd * sd)); }
    }
    if (asp !== 1) { const ca = Math.cos(a), sa = Math.sin(a) / asp; f /= Math.sqrt(ca * ca + sa * sa); }
    return f;
  };
}

function hash3(x, y, z, seed) {
  let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(z, 1440670441) ^ Math.imul(seed, 2246822519);
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h & 0xffff) / 32767.5 - 1;
}
function vnoise(x, y, z, seed) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const fx = x - xi, fy = y - yi, fz = z - zi;
  const q = t => t * t * t * (t * (t * 6 - 15) + 10);
  const u = q(fx), v = q(fy), w = q(fz);

}

function makePattern(Rm) {

  if (p.rings.on) { const n = p.rings.count, { depth: d, sharp: s } = p.rings; L.push((a, t) => d * sh(0.5 + 0.5 * Math.cos(n * TAU * t), s)); }
  if (p.wavy.on) { const n = p.wavy.count, wv = Math.round(p.wavy.waves), { amp, depth: d, sharp: s } = p.wavy; L.push((a, t) => d * sh(0.5 + 0.5 * Math.cos(n * TAU * t + amp * Math.sin(wv * a)), s)); }

    const n = Math.round(p.diamond.count), rows = p.diamond.rows, d = p.diamond.depth;
    const tri = x => 1 - 2 * Math.abs(x - Math.floor(x) - 0.5);
    L.push((a, t) => { const u = n * a / TAU, v = rows * t; return d * Math.min(tri(u + v), tri(u - v)); });
  }

    });

const smoothstepE = (e, x) => e <= 0 ? 1 : x >= e ? 1 : x <= 0 ? 0 : (x /= e, x * x * (3 - 2 * x));

// Builds the shade wall as one closed, indexed mesh in print coordinates (Z up, connector end on the bed).
function buildShade(N, layer) {
  const prof = buildProfile(), n = prof.length - 1, H = P.height, W = P.width;
  const pend = P.orient === 'pendant', twistMount = P.mount === 'twist';
  const pr = t => { const x = Math.min(n, Math.max(0, t * n)), i = Math.min(n - 1, Math.floor(x)); return (prof[i] + (prof[i + 1] - prof[i]) * (x - i)) * W; };

  const shapeF = makeShapeF(), patt = makePattern(Rm);
  const twR = P.twist * DEG;

    const zU = tU * H;

      const a = ang[j] - tw;
      let r = base * shapeF(a);
      if (fade > 0) r += fade * patt(a, tU, zU, base);
      r = Math.max(r, P.wall + 2);
      O[j] = r; I[j] = Math.max(1, r - wh);
    }
  }

  const o0 = new Float64Array(N), i0 = new Float64Array(N);
  rowBody(0, o0, i0);
  let zStart = 0, transH = 0, Rco = 0, Rci = 0, wT = 0;
  if (twistMount) {
    Rco = P.collarD / 2 + P.collarWall; Rci = P.collarD / 2;
    wT = P.wall / Math.cos(lim);   // horizontal thickness that keeps the sloped flare at least one wall thick
    let md = 0;
    for (let j = 0; j < N; j++) md = Math.max(md, Math.abs(o0[j] - Rco), Math.abs(i0[j] - Rci));
    transH = Math.max(2, md / Math.tan(lim));
    zStart = P.collarH;
  }
  const zb = zStart + transH;
  const nT = twistMount ? Math.max(2, Math.ceil(transH / layer)) : 0;
  const nB = Math.max(2, Math.ceil(H / layer));

  const pos = new Float32Array(NM * 2 * 3), rowZ = new Float64Array(M), rowMinIn = new Float64Array(M);

  let maxR = 0;
  for (let i = 0; i < M; i++) {
    let z;
    if (i < nT) {
      const s = i / nT; z = zStart + s * transH;
      // Flare from the collar's own walls (no step, so nothing overhangs at the joint). The trailing wall stays vertical
      // until it's a full sloped-wall thickness away from the leading one, which thickens the joint like a fillet.
      for (let j = 0; j < N; j++) {
        let o = Rco + (o0[j] - Rco) * s, n = Rci + (i0[j] - Rci) * s;
        const w = wT + (o0[j] - i0[j] - wT) * s;
        if (o0[j] >= Rco) n = Math.min(n, Math.max(Rci, o - w));
        else o = Math.max(o, Math.min(Rco, n + w));
        O[j] = o; I[j] = n;
      }
    } else { const zz = (i - nT) / nB * H; z = zb + zz; rowBody(zz, O, I); }
    rowZ[i] = z;
    let mi = 1e9;
    for (let j = 0; j < N; j++) {
      const ko = (i * N + j) * 3, ki = (NM + i * N + j) * 3;
      pos[ko] = O[j] * cosA[j]; pos[ko + 1] = O[j] * sinA[j]; pos[ko + 2] = z;
      pos[ki] = I[j] * cosA[j]; pos[ki + 1] = I[j] * sinA[j]; pos[ki + 2] = z;
      if (I[j] < mi) mi = I[j];
      if (O[j] > maxR) maxR = O[j];
    }

  }

  }

  }

function meshVolume(pos, idx) {

  }

}

let W = null;

    const neck = tr(box(2 * hx, P.slotW, 0.01), -hx, -hw, s.zPlateBot - 0.01);
    ins.push(keep(W.Manifold.hull([ring, neck])));
    ins.push(tr(cyl(s.zFunnel + 1.01, s.cavR, s.cavR, seg), 0, 0, -1));
    }
  } else {
    const hr = P.holeD / 2;
    ins.push(tr(cyl(P.plateT + 2, hr, hr, seg), 0, 0, f - P.plateT - 1));
    if (!B.adapter) {
      const cr = P.socketD / 2, top = f - P.plateT, coneH = Math.max(0, cr - hr);
      ins.push(tr(cyl(top - coneH + 1, cr, cr, seg), 0, 0, -1));
      if (coneH > 0) ins.push(tr(cyl(coneH + 0.01, cr, hr, seg), 0, 0, top - coneH));
    }
  }
  if (!B.adapter) {
    // cable channel with an arched roof (prints without support)
    const hw = P.cableW / 2;
    const chan = (x, len, dz) => [tr(box(len, P.cableW, Math.max(0.02, P.cableW - hw)), x, -hw, dz - 0.01), tr(rot(cyl(len, hw, hw, 32), [0, 90, 0]), x, 0, dz + P.cableW - hw)];
    ins.push(keep(W.Manifold.hull(chan(0, B.Rb + 2, 0))));
    if (coverActive(B)) {

      // and ramps back down at 45° (printable roof) to the normal channel
      const X = coverEdge(B);
      ins.push(keep(W.Manifold.hull([...chan(X - 3, 3.5, P.coverT), ...chan(X + 0.5 + P.coverT, 0.01, 0)])));
    }

    // easily, with a 45° underside down to the bed so they print without support. Placed in whatever run of channel
    // is free between the light-source cavity and the rim.
    const gap = Math.max(1, P.cableD - 0.6), hw = P.cableW / 2, rc = P.cableD / 2;

        const y0 = sgn * P.cableW / 2;
        beads.push(keep(W.Manifold.hull([tr(rot(cyl(L, r, r, 24), [0, 90, 0]), x, y0, r * Math.SQRT2), tr(box(L, 0.01, 0.01), x, y0 - 0.005, 0)])));

    }
    if (beads.length) result = keep(result.add(sub(uni(beads), sub(tr(cyl(P.cableW + 3, B.Rb + 5, B.Rb + 5, seg), 0, 0, -1), body))));
  }
  if (P.detent) {
    const bumps = [], len = g1 - (B.Ro + 0.3);
    for (let k = 0; k < P.lugs; k++) {
      const th = k * 360 / P.lugs + P.lugW / 2 - P.turn + ca + 1.5;
      bumps.push(rotZ(tr(rot(cyl(len, 0.9, 0.9, 16), [0, 90, 0]), B.Ro + 0.3, 0, f - 0.45), th));
    }
    result = keep(result.add(uni(bumps)));
  }
  return result;
}

// ---------------------------------------------------------------- update cycle
let lastStats = null;
function analyse(S, geo) {
  const nrm = geo.attributes.normal.array, NM = S.N * S.M;

  const base = new THREE.Color(P.color), red = new THREE.Color('#ff3b30');
  const zMin = (P.mount === 'twist' ? S.zStart : 0) + 0.6, lim = P.overhang;
  let bad = 0, total = 0, maxOver = 0;
  for (let k = 0; k < NM; k++) {
    const i = Math.floor(k / S.N), z = S.rowZ[i];
    let flag = false;

      const ov = Math.max(-nrm[k * 3 + 2], -nrm[(NM + k) * 3 + 2]);
      const deg = ov > 0 ? Math.asin(Math.min(1, ov)) / DEG : 0;

  }

}

function update() {

  connMat.color.set(P.color); baseMat.color.set(P.baseColor);

  const merged = view3.cut && W && P.mount !== 'none';

  let connVol = 0, baseVol = 0, baseBox = null;
  const B = baseDims();

    const c = shadeConnector(S, 96, merged ? 0.4 : 0);
    if (c && merged) {
      const body = new W.Manifold(new W.Mesh({ numProp: 3, vertProperties: S.pos, triVerts: S.idx }));
      addSolid(shadeGroup, manifoldToGeo(body.add(c)), connMat, capShadeMat);

  shadeGroup.rotation.z = twist && !view3.explode ? -P.turn * DEG : 0;

    ghostGroup.add(zCyl(br, br, 14, z0 - 2));

    checks.push([ok, ok ? `All ${plate.length} parts fit on one plate together` : `The ${plate.length} parts don’t fit on one plate — export them one by one`]);
  }
  if (P.mount === 'ring') {
    const minIn = Math.min(...S.rIn0);

  }

    } else if (B.insert === 'slot') {

      const okC = P.slotD + 2 * B.c + 8 <= P.collarD;
      checks.push([okC, okC ? `Puck Ø${P.slotD} sits inside the Ø${P.collarD} collar` : `Collar Ø${P.collarD} is too tight around the Ø${P.slotD} puck`]);
    } else {

    }

  const parts = [`Shade Ø${shadeW.toFixed(0)} × ${shadeH.toFixed(0)} mm · ≈${shadeG.toFixed(0)} g ${P.material}`];
  if (baseBox) parts.push(`${B.adapter ? 'Adapter' : 'Base'} Ø${(2 * Math.max(B.Rt, B.Rb)).toFixed(0)} × ${B.H.toFixed(0)} mm · ≈${(baseVol / 1000 * dens).toFixed(0)} g`);
  document.getElementById('dims').innerHTML = parts.join('<br>');
  document.getElementById('expBase').hidden = !twist;
  document.getElementById('expCover').hidden = document.getElementById('tbCover').hidden = !(twist && coverActive(B));
  document.querySelector('#expBase span').textContent = B.adapter ? 'Adapter' : 'Base';
  document.getElementById('expPlate').hidden = !twist;
  document.getElementById('tbExplode').hidden = !twist;
  document.getElementById('tbBase').hidden = !twist;

  // floor + framing
  root.updateMatrixWorld(true);
  const bb = new THREE.Box3().setFromObject(assembly);
  const size = bb.getSize(new THREE.Vector3()), ctr = bb.getCenter(new THREE.Vector3());
  floor.position.set(ctr.x, bb.min.y - 0.5, ctr.z); floor.scale.setScalar(Math.max(size.x, size.z) * 0.75);
  keyLight.target.position.copy(ctr);

  lastStats = { bb };
  if (focusPending && baseGroup.children.length && document.querySelector('#tabs .on')?.dataset.tab === 'connector') { focusPending = false; requestAnimationFrame(focusConnector); }
  drawProfile();
  updateTitle();
  scheduleHistory();
  save();
}

// ---------------------------------------------------------------- undo / redo
// Snapshots of the design (user values) taken ~0.4 s after changes settle, so a slider drag is one step.
let hist = [], hi = -1, histT = 0;
function resetHistory() { clearTimeout(histT); hist = [designJSON()]; hi = 0; updateUndoButtons(); }
function commitHistory() {
  clearTimeout(histT);
  const s = designJSON();
  if (hi >= 0 && s === hist[hi]) return;
  hist = hist.slice(0, hi + 1); hist.push(s);
  if (hist.length > 200) hist.shift();
  hi = hist.length - 1; updateUndoButtons();
}
function scheduleHistory() { if (hi < 0) return resetHistory(); clearTimeout(histT); histT = setTimeout(commitHistory, 400); }
function restoreHistory(i) {
  hi = i; P = merge(clone(DEFAULT), JSON.parse(hist[hi])); initIntent();
  refreshAll(); invalidate(); updateUndoButtons();
}
function undo() { commitHistory(); if (hi > 0) restoreHistory(hi - 1); }
function redo() { commitHistory(); if (hi < hist.length - 1) restoreHistory(hi + 1); }
function updateUndoButtons() {
  document.getElementById('fUndo').disabled = hi <= 0;
  document.getElementById('fRedo').disabled = hi >= hist.length - 1;
}
const VIEWS = { front: [0, 0, 1], back: [0, 0, -1], right: [1, 0, 0], left: [-1, 0, 0], top: [0, 1, 0.0001], bottom: [0, -1, 0.0001], iso: [0.55, 0.35, 0.76] };
let viewAnim = 0;
function setView(name, bb = lastStats?.bb) {
  if (!bb) return;
  const ctr = bb.getCenter(new THREE.Vector3()), r = bb.getSize(new THREE.Vector3()).length() / 2;
  const dist = r / Math.sin(camera.fov * DEG / 2) * 1.05;
  const to = new THREE.Vector3(...VIEWS[name]).normalize().multiplyScalar(dist).add(ctr);
  const from = camera.position.clone(), t0 = controls.target.clone(), id = ++viewAnim, start = performance.now();
  camera.near = dist / 50; camera.far = dist * 20; camera.updateProjectionMatrix();
  const step = now => {
    if (id !== viewAnim) return;
    const k = document.hidden ? 1 : Math.min(1, (now - start) / 260), e = k * k * (3 - 2 * k);
    controls.target.lerpVectors(t0, ctr, e);
    // swing around the target rather than straight through it
    const a = from.clone().sub(t0), b = to.clone().sub(ctr), len = a.length() + (b.length() - a.length()) * e;
    camera.position.copy(a.normalize().lerp(b.normalize(), e).normalize().multiplyScalar(len).add(controls.target));
    if (k < 1) requestAnimationFrame(step);
  };
  if (document.hidden) step(start + 1e6); else requestAnimationFrame(step);
}
document.getElementById('viewpad').addEventListener('click', e => { const b = e.target.closest('[data-view]'); if (b) setView(b.dataset.view); });
// Lay round parts out on the bed: largest first, each at the first spot (scanning front-to-back, left-to-right on a
// 2 mm grid) that keeps 6 mm between parts and 5 mm from the edges, so small parts tuck in beside big ones. Parts are
// centred on their own origin; returns each part's centre on the bed (layout centred), or null if they don't all fit.
function packBed(items, bx, by, gap = 6, edge = 5) {

// Collapsible groups: everything after a heading (up to the next one) moves into a body that the heading folds away.
// Each control still shows/hides on its own conditions inside the body. Folded headings are remembered per browser.
{
  let folded = {};
  try { folded = JSON.parse(localStorage.getItem('illum.folded') || '{}'); } catch (e) { /* storage unavailable */ }
  for (const panel of document.querySelectorAll('.panel')) for (const h of [...panel.querySelectorAll(':scope > h3')]) {
    const body = document.createElement('div'); body.className = 'grpbody';
    while (h.nextElementSibling && !h.nextElementSibling.matches('h3')) body.append(h.nextElementSibling);
    h.after(body);
    const id = panel.id + ':' + h.firstChild.textContent;
    const set = on => { h.classList.toggle('collapsed', on); body.classList.toggle('collapsed', on); };
    set(!!folded[id]);
    h.addEventListener('click', e => {
      if (e.target.closest('.info')) return;
      folded[id] = !h.classList.contains('collapsed'); set(folded[id]);
      try { localStorage.setItem('illum.folded', JSON.stringify(folded)); } catch (err) { /* storage unavailable */ }
    });
  }
}

function randomize() {
  const pick = a => a[Math.floor(Math.random() * a.length)], rr = (a, b) => a + Math.random() * (b - a);
  P.profile = clone(PROFILES[pick(Object.keys(PROFILES))]).map(([t, r]) => [t, Math.max(30, r * rr(0.85, 1.15))]);
  P.height = Math.round(rr(120, 200));
  P.sides = Math.random() < 0.3 ? Math.round(rr(4, 9)) : 0; P.round = rr(0.1, 0.6);
  P.twist = Math.random() < 0.4 ? Math.round(rr(-120, 120)) : 0;
  for (const k in P.pat) P.pat[k].on = false;
  const choices = Object.keys(P.pat), first = pick(choices);
  P.pat[first].on = true;
  if (Math.random() < 0.35) P.pat[pick(choices)].on = true;
  const pt = P.pat;
  pt.ribs.count = Math.round(rr(12, 60)); pt.ribs.sharp = rr(0.6, 4); pt.ribs.depth = rr(1, 3.5);
  pt.spiral.count = Math.round(rr(10, 48)); pt.spiral.turns = rr(-1, 1); pt.spiral.depth = rr(1, 3.5);
  pt.rings.count = rr(8, 40); pt.wavy.count = rr(6, 24); pt.wavy.waves = Math.round(rr(3, 10)); pt.wavy.amp = rr(0.5, 3);
  pt.diamond.count = Math.round(rr(10, 30)); pt.diamond.rows = rr(5, 16);
  pt.bubbles.count = Math.round(rr(10, 26)); pt.noise.seed = Math.round(rr(1, 99)); pt.noise.scale = rr(10, 40);
  refreshAll(); invalidate();
}

// ---------------------------------------------------------------- projects
const isDirty = () => designJSON() !== cur.snap;
function loadProjects() { try { return JSON.parse(localStorage.getItem('illum.projects')) || []; } catch (e) { return []; } }
function storeProjects(list) {
  try { localStorage.setItem('illum.projects', JSON.stringify(list)); return true; }
  catch (e) { alert('Could not save: browser storage is full. Export some projects as .json, then delete them here.'); return false; }
}
function persistCur() { try { localStorage.setItem('illum.current', JSON.stringify(cur)); } catch (e) { /* storage unavailable */ } }
function updateTitle() {
  const d = isDirty();
  document.getElementById('projName').textContent = cur.name;
  document.getElementById('projDirty').classList.toggle('on', d);
  document.title = (d ? '• ' : '') + cur.name + ' — Illuminate3D';
}
let toastT = 0;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1800); }
function thumbnail() {
  update();   // a rebuild may still be queued (e.g. right after New/Open)
  renderer.render(scene, camera);
  const src = renderer.domElement, c = document.createElement('canvas'), w = 240, h = 180;
  c.width = w; c.height = h;
  const x = c.getContext('2d'); x.fillStyle = '#1c1c1e'; x.fillRect(0, 0, w, h);
  const sc = Math.max(w / src.width, h / src.height);
  x.drawImage(src, (w - src.width * sc) / 2, (h - src.height * sc) / 2, src.width * sc, src.height * sc);
  return c.toDataURL('image/jpeg', 0.8);
}
function confirmDiscard() { return !isDirty() || confirm(`Discard unsaved changes to “${cur.name}”?`); }
function loadDesign(data, meta) {
  P = merge(clone(DEFAULT), clone(data));
  initIntent();
  cur = { id: null, name: 'Untitled lamp', ...meta, snap: designJSON() };
  resetHistory();
  persistCur(); refreshAll(); firstFrame = true; invalidate();
}
function saveProject(asNew) {
  let name = cur.name;
  if (asNew || !cur.id) {
    const n = prompt('Project name', asNew && cur.id ? cur.name + ' copy' : cur.name);
    if (n === null) return;
    name = n.trim() || 'Untitled lamp';
  }
  const id = asNew || !cur.id ? 'p' + Date.now().toString(36) : cur.id;
  const list = loadProjects(), entry = { id, name, updated: Date.now(), thumb: thumbnail(), data: designState() };
  const i = list.findIndex(q => q.id === id);
  if (i >= 0) list[i] = entry; else list.unshift(entry);
  if (!storeProjects(list)) return;
  cur = { id, name, snap: designJSON() };
  persistCur(); updateTitle(); toast(`Saved “${name}”`);
}
async function exportJSON(name, data) {
  const file = slug(name) + '.json', target = await pickTarget(file, 'json');
  if (target) await saveTo(target, new Blob([JSON.stringify({ app: 'Illuminate3D', version: 1, name, data }, null, 1)], { type: 'application/json' }), file);
}
async function importJSON(f) {
  if (!f || !confirmDiscard()) return;
  try {
    const j = JSON.parse(await f.text());
    const data = j.app === 'Illuminate3D' ? j.data : j;
    loadDesign(data, { id: null, name: j.name || f.name.replace(/\.json$/i, '') });
    cur.snap = null; persistCur(); updateTitle();
    closeProjects(); toast('Imported — press Save to keep it in your projects');
  } catch (e) { alert('Could not read that design file.'); }
}
function renderProjects() {
  const grid = document.getElementById('projGrid'), list = loadProjects().sort((a, b) => b.updated - a.updated);
  grid.innerHTML = list.length ? '' : '<div class="pempty">No saved projects yet. Press Save to keep the current design here.</div>';
  for (const q of list) {
    const el = document.createElement('div'); el.className = 'pcard' + (q.id === cur.id ? ' cur' : '');
    el.innerHTML = `<img alt=""><div class="pmeta"><div class="pname"></div><div class="pdate"></div></div><div class="pact"><button data-a="open">Open</button><button data-a="rename">Rename</button><button data-a="export">Export</button><button data-a="delete">Delete</button></div>`;
    el.querySelector('img').src = q.thumb || '';
    el.querySelector('.pname').textContent = q.name;
    el.querySelector('.pdate').textContent = new Date(q.updated).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) + (q.id === cur.id ? ' · open now' : '');
    const act = a => {
      const all = loadProjects(), it = all.find(x => x.id === q.id);
      if (!it) return renderProjects();
      if (a === 'open') { if (q.id !== cur.id || isDirty()) { if (!confirmDiscard()) return; loadDesign(it.data, { id: it.id, name: it.name }); } closeProjects(); }
      if (a === 'rename') { const n = prompt('Rename project', it.name); if (n && n.trim()) { it.name = n.trim(); storeProjects(all); if (cur.id === it.id) { cur.name = it.name; persistCur(); updateTitle(); } renderProjects(); } }
      if (a === 'export') exportJSON(it.name, it.data);
      if (a === 'delete' && confirm(`Delete “${it.name}”? This cannot be undone.`)) { storeProjects(all.filter(x => x.id !== it.id)); if (cur.id === it.id) { cur.id = null; cur.snap = null; persistCur(); updateTitle(); } renderProjects(); }
    };
    el.querySelector('img').onclick = () => act('open');
    el.querySelectorAll('.pact button').forEach(b => b.onclick = () => act(b.dataset.a));
    grid.append(el);
  }
}

const slug = n => (n || 'lamp').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-').toLowerCase() || 'lamp';
async function pickTarget(name, kind) {   // returns a file handle, 'download', or null if the user cancelled

    let told = false; try { told = localStorage.getItem('illum.saveHint') === '1'; } catch {}
    if (!told) {
      alert('This browser can’t show a “Save to…” folder picker, so the file will go to your Downloads folder.\n\n' +
        '• Safari: Settings → General → File download location → “Ask for each download”.\n' +
        '• Or open Illuminate3D in Chrome or Edge, which ask where to save every time.');
      try { localStorage.setItem('illum.saveHint', '1'); } catch {}

    return 'download';

  catch (e) {

async function saveTo(target, blob, name) {

  const w = await target.createWritable(); await w.write(blob); await w.close();

function download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }

const QUALITY = { standard: { n: 240, layer: 0.8, seg: 128 }, fine: { n: 360, layer: 0.5, seg: 192 }, ultra: { n: 540, layer: 0.3, seg: 256 } };
const busy = document.getElementById('busy');
function buildPart(name, q) {   // watertight part in print orientation

    const S = buildShade(q.n, q.layer);

    const conn = shadeConnector(S, q.seg);

async function exportPlate() {

    const q = QUALITY[P.exportQ], pr = PRINTERS[P.printer], B = baseDims();

      const names = plateParts(B, 0).map(p => p.name);

async function runExport(which) {

  const name = `${slug(cur.name)}-${part}.stl`, target = await pickTarget(name, 'stl');
  if (!target) return;
  busy.textContent = 'Building watertight mesh…'; busy.classList.add('on');
  await new Promise(r => setTimeout(r, 30));
  try {
    const q = QUALITY[P.exportQ];
    const blob = gcScope(() => {
      const man = buildPart(which, q);

document.getElementById('expShade').onclick = () => runExport('shade');
document.getElementById('expBase').onclick = () => runExport('base');
document.getElementById('expCover').onclick = () => runExport('cover');
document.getElementById('expPlate').onclick = exportPlate;

// ---------------------------------------------------------------- boot
refreshAll();
document.getElementById('tbOver').classList.toggle('on', view3.over);
busy.classList.add('on');
update();
Module().then(m => { m.setup(); W = m; busy.classList.remove('on'); invalidate(); })
  .catch(e => { console.error(e); busy.textContent = 'Could not load the geometry engine — serve this folder over http (see README).'; });
