<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Illuminate3D</title>
<meta name="description" content="Design 3D-printable lampshades with twist-lock, socket and LED puck connectors.">
<meta name="theme-color" content="#1f1f21">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Illuminate3D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root {
  --bg: #f4f3f0; --panel: #ffffff; --panel-2: #f7f6f3; --line: #e3e1dc; --track: #e3e1dc; --text: #1d1d1f; --muted: #6e6e73;
  --accent: #0e8fa0; --accent-soft: rgba(14,143,160,.13); --ok: #2f9e55; --warn: #d7462e; --view: radial-gradient(ellipse at 50% 35%, #ffffff 0%, #e9e7e2 70%);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161617; --panel: #1f1f21; --panel-2: #262628; --line: #333336; --track: #48484c; --text: #f2f2f4; --muted: #9a9aa0;
    --accent: #2cb5c8; --accent-soft: rgba(44,181,200,.16); --ok: #4cc27a; --warn: #ff6b55; --view: radial-gradient(ellipse at 50% 35%, #2c2c2f 0%, #141415 75%);
  }
}
:root[data-theme="dark"] {
  --bg: #161617; --panel: #1f1f21; --panel-2: #262628; --line: #333336; --track: #48484c; --text: #f2f2f4; --muted: #9a9aa0;
  --accent: #2cb5c8; --accent-soft: rgba(44,181,200,.16); --ok: #4cc27a; --warn: #ff6b55; --view: radial-gradient(ellipse at 50% 35%, #2c2c2f 0%, #141415 75%);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; }
#app { display: grid; grid-template-columns: 400px 1fr; height: 100vh; }
aside { display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line); min-height: 0; }
header { padding: 14px 16px 10px; display: flex; align-items: baseline; gap: 8px; }
header h1 { font-size: 16px; font-weight: 700; margin: 0; letter-spacing: -.02em; }
#projName { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px; padding: 2px 6px; border-radius: 6px; cursor: text; max-width: 210px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#projName:hover { background: var(--panel-2); color: var(--text); }
#projDirty { color: var(--accent); font-size: 10px; visibility: hidden; }
#projDirty.on { visibility: visible; }
#filebar { display: flex; gap: 4px; padding: 0 12px 10px; }
#filebar button { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid transparent; background: transparent; color: var(--muted); border-radius: 8px; padding: 6px 0; font: inherit; font-size: 12.5px; font-weight: 500; letter-spacing: -.005em; cursor: pointer; white-space: nowrap; }
#filebar button:hover { background: var(--panel-2); color: var(--text); border-color: var(--line); }
#filebar button svg, nav button svg { flex: none; opacity: .9; }
#filebar button.icon { flex: 0 0 34px; display: grid; place-items: center; }
#filebar button:disabled { opacity: .35; cursor: default; border-color: var(--line); }
#toast { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 14px; font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; }
#toast.on { opacity: 1; }
#modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; z-index: 10; padding: 16px; }
#modal[hidden] { display: none; }
.sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; width: min(860px, 100%); max-height: 86vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
.sheethead, .sheetfoot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; }
.sheethead h2 { margin: 0; font-size: 16px; }
.sheetfoot { border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; justify-content: flex-start; }
#projGrid { overflow-y: auto; padding: 4px 16px 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.pcard { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel-2); }
.pcard.cur { border-color: var(--accent); }
.pcard img { display: block; width: 100%; aspect-ratio: 4/3; object-fit: cover; background: #1c1c1e; cursor: pointer; }
.pcard .pmeta { padding: 8px 10px 4px; }
.pcard .pname { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pcard .pdate { color: var(--muted); font-size: 11px; }
.pcard .pact { display: flex; gap: 4px; padding: 6px 8px 8px; }
.pcard .pact button { flex: 1; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 11px; padding: 4px 0; border-radius: 5px; cursor: pointer; }
.pcard .pact button:hover { background: var(--panel); color: var(--text); }
.pempty { grid-column: 1 / -1; color: var(--muted); text-align: center; padding: 40px 0; }
nav { display: flex; gap: 4px; padding: 0 12px 10px; border-bottom: 1px solid var(--line); }
nav button { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; background: transparent; color: var(--muted); padding: 7px 0; border-radius: 8px; font: inherit; font-size: 12.5px; font-weight: 600; letter-spacing: -.005em; cursor: pointer; white-space: nowrap; }
nav button:hover:not(.on) { background: var(--panel-2); color: var(--text); }
nav button.on { background: var(--accent-soft); color: var(--accent); }
#panels { flex: 1; overflow-y: auto; padding: 4px 16px 16px; min-height: 0; }
/* App bar: project and export actions, set apart from the design settings below */
#appbar { background: var(--bg); border-bottom: 1px solid var(--line); padding: 10px 12px; }
#appbar header { padding: 0 2px 8px; }
.abrow { display: flex; align-items: center; gap: 8px; }
#appbar #filebar { flex: 1; padding: 2px; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; }
#appbar #filebar button { font-size: 12px; padding: 5px 0; gap: 5px; }
#expWrap { position: relative; }
#expBtn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 10px; border-radius: 9px; }
#expMenu { position: absolute; right: 0; top: calc(100% + 6px); width: 250px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 32px rgba(0,0,0,.28); padding: 4px; z-index: 20; }
#expMenu[hidden], #expMenu .mi[hidden] { display: none; }
.mi { display: flex; gap: 10px; align-items: center; width: 100%; border: 0; background: transparent; color: var(--text); padding: 8px 10px; border-radius: 7px; text-align: left; font: inherit; cursor: pointer; }
.mi:hover, .mi:focus-visible { background: var(--accent-soft); outline: none; }
.mi svg { color: var(--accent); flex: none; }
.mi span { display: flex; flex-direction: column; } .mi b { font-weight: 600; } .mi small { color: var(--muted); font-size: 11px; }
#expPlate { margin-bottom: 3px; box-shadow: 0 1px 0 var(--line); border-radius: 7px 7px 0 0; }
/* Settings: a vertical tab rail beside the panels */
#work { flex: 1; display: flex; min-height: 0; }
nav#tabs { flex-direction: column; flex: 0 0 66px; padding: 10px 6px; gap: 4px; border-bottom: 0; border-right: 1px solid var(--line); }
nav#tabs button { flex: none; flex-direction: column; gap: 4px; padding: 10px 0 8px; font-size: 10.5px; letter-spacing: .01em; }
nav#tabs button svg { width: 20px; height: 20px; }
nav#tabs button.on { box-shadow: inset 3px 0 0 var(--accent); }
#work #panels { min-width: 0; padding: 4px 14px 16px; }

.panel { display: none; } .panel.on { display: block; }
h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 8px; font-weight: 700; }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px 4px; margin: 8px 0; background: var(--panel-2); }
.card > .cardhead { display: flex; align-items: center; justify-content: space-between; font-weight: 600; padding-bottom: 4px; }
.card.off > .ctl { display: none; }
.ctl { display: grid; grid-template-columns: 112px 1fr 62px; align-items: center; gap: 8px; margin: 6px 0; }
.ctl.wide { grid-template-columns: 112px 1fr; }
.ctl label { color: var(--muted); font-size: 12px; }
.ctl .lim { display: block; font-size: 10px; color: var(--accent); }
.ctl .lim { cursor: help; }
.ctl .lim .warn { display: inline-grid; place-items: center; width: 13px; height: 13px; margin-left: 4px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 9px; font-weight: 800; vertical-align: 1px; }
#tipbox { position: fixed; z-index: 30; max-width: 300px; padding: 8px 10px; border-radius: 8px; background: var(--panel); color: var(--text); border: 1px solid var(--line); box-shadow: 0 8px 24px rgba(0,0,0,.25); font-size: 12px; line-height: 1.4; pointer-events: none; display: none; }
.ctl[hidden], .card[hidden], h3[hidden] { display: none !important; }
.partbar { margin: 4px 0 6px; } .partbar[hidden] { display: none; } .partbar button { padding: 7px 2px; font-size: 13px; font-weight: 600; }
.panel h3 { cursor: pointer; user-select: none; display: flex; align-items: center; gap: 0; }
.panel h3::before { content: ''; width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 5px solid currentColor; margin-right: 7px; transition: transform .15s; flex: none; }
.panel h3.collapsed::before { transform: rotate(-90deg); }
.panel h3:hover { color: var(--text); }
.grpbody.collapsed { display: none; }
#panelbar { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; justify-content: space-between; margin: 0 -14px; padding: 8px 14px 6px; background: var(--panel); }
#panelTitle { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
#foldAll { width: 30px; height: 28px; display: grid; place-items: center; padding: 0; border: 1px solid var(--line); border-radius: 7px; background: var(--panel-2); color: var(--muted); cursor: pointer; }
#foldAll:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.grp { border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; margin: 10px 0; }
.grp:has(> h3[hidden]) { display: none; }
.grp > h3 { margin: 0 -10px; padding: 11px 10px; border-radius: 9px; }
.grp > h3:not(.collapsed) { color: var(--text); border-bottom: 1px solid var(--line); border-radius: 9px 9px 0 0; margin-bottom: 4px; }
.grp > .grpbody { padding-bottom: 4px; }
.presetrow { display: flex; gap: 6px; align-items: center; }
.presetrow select { flex: 1; min-width: 0; }
.presetrow button { flex: none; padding: 4px 6px; display: grid; place-items: center; }
.presetrow button:disabled { opacity: .35; cursor: default; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; margin: 0; background: transparent; cursor: pointer; --p: 50%; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--accent) var(--p), var(--track) var(--p)); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--track); }
input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--accent); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px; border-radius: 50%; background: var(--accent); border: 2px solid var(--panel); box-shadow: 0 1px 4px rgba(0,0,0,.35); transition: transform .1s; }
input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 2px solid var(--panel); box-shadow: 0 1px 4px rgba(0,0,0,.35); }
input[type=range]:active::-webkit-slider-thumb { transform: scale(1.2); }
input[type=range]:focus-visible { outline: none; }
input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px var(--accent-soft); }
.ctl.sl { grid-template-columns: 1fr auto auto; grid-template-areas: "lab num rst" "rg rg rg"; gap: 5px 6px; margin: 8px 0 12px; }
.ctl.sl label { grid-area: lab; } .ctl.sl .numbox { grid-area: num; } .ctl.sl .rst { grid-area: rst; } .ctl.sl input[type=range] { grid-area: rg; }
.numbox { display: flex; align-items: center; width: 98px; height: 28px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px; padding-left: 6px; overflow: hidden; }
.numbox:focus-within { border-color: var(--accent); }
.numbox input[type=number] { flex: 1; min-width: 0; border: 0; background: transparent; padding: 0 4px 0 0; text-align: right; font-variant-numeric: tabular-nums; -moz-appearance: textfield; outline: none; }
.numbox input::-webkit-inner-spin-button, .numbox input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.numbox .u { font-size: 11px; font-weight: 600; color: var(--muted); padding-right: 5px; }
.numbox .stp { display: flex; flex-direction: column; align-self: stretch; border-left: 1px solid var(--line); }
.numbox .stp button { flex: 1; width: 18px; padding: 0; border: 0; background: transparent; color: var(--muted); cursor: pointer; display: grid; place-items: center; }
.numbox .stp button:first-child { border-bottom: 1px solid var(--line); }
.numbox .stp button:hover { color: var(--accent); background: var(--accent-soft); }
.rst { width: 28px; height: 28px; padding: 0; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); color: var(--muted); cursor: pointer; display: grid; place-items: center; }
.rst:hover:not(:disabled) { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.rst:disabled { opacity: .35; cursor: default; }
input[type=number], select { width: 100%; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; font: inherit; }
input[type=number] { text-align: right; padding-right: 4px; }
.seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 2px; gap: 2px; }
.seg button { flex: 1; border: 0; background: transparent; color: var(--muted); padding: 4px 2px; border-radius: 5px; font: inherit; font-size: 12px; cursor: pointer; }
.seg button.on { background: var(--accent); color: #fff; }
.switch { display: block; position: relative; width: 34px; height: 20px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; background: var(--line); border-radius: 20px; transition: .15s; cursor: pointer; }
.switch span::after { content: ""; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; background: #fff; border-radius: 50%; transition: .15s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(14px); }
.presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.btn { border: 1px solid var(--line); background: var(--panel-2); color: var(--text); border-radius: 7px; padding: 6px 8px; font: inherit; font-size: 12px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn:disabled { opacity: .5; cursor: default; }
#profileWrap { border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); margin-top: 10px; }
#profileCanvas { width: 100%; height: 250px; display: block; touch-action: none; cursor: crosshair; }
.hint { color: var(--muted); font-size: 11px; padding: 0 10px 8px; }
.note { color: var(--muted); font-size: 12px; margin: 6px 0; }
footer { border-top: 1px solid var(--line); padding: 10px 16px 14px; }
#checkPanel { position: absolute; top: 12px; right: 74px; width: 290px; max-height: calc(100% - 150px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px 10px; box-shadow: 0 4px 16px rgba(0,0,0,.08); z-index: 2; }
#checkPanel[hidden] { display: none; }
#checkPanel header { display: flex; align-items: center; justify-content: space-between; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
#checkPanel header button { border: 0; background: none; color: var(--muted); font-size: 16px; line-height: 1; cursor: pointer; padding: 0 2px; }
#checkPanel header button:hover { color: var(--text); }
#tbChecks { position: relative; }
#colorbox { position: absolute; right: 14px; top: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 6px; box-shadow: 0 4px 16px rgba(0,0,0,.08); z-index: 3; }
#colorbox .cbl { font-size: 9.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
#colorbox .chip { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; padding: 0; box-shadow: inset 0 0 0 2px var(--panel); }
#colorbox .chip:hover, #colorbox .chip.open { border-color: var(--accent); }
#colorbox .sep { width: 24px; height: 1px; background: var(--line); margin: 4px 0; }
#swatches { position: absolute; right: calc(100% + 8px); top: 0; width: 196px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.14); }
#swatches[hidden] { display: none; }
#swatches .swt { font-size: 11px; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
#swatches .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
#swatches .grid button { width: 24px; height: 24px; border-radius: 50%; border: 1px solid rgba(0,0,0,.18); cursor: pointer; padding: 0; }
#swatches .grid button.on { outline: 2px solid var(--accent); outline-offset: 2px; }
#swatches .custom { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; font-size: 12px; color: var(--muted); }
#swatches .custom input { width: 44px; height: 24px; border: 0; background: none; padding: 0; cursor: pointer; }
#tbChecks .badge { position: absolute; top: 1px; right: 1px; min-width: 15px; height: 15px; padding: 0 4px; border-radius: 8px; background: var(--warn); color: #fff; font-size: 9.5px; font-weight: 800; line-height: 15px; text-align: center; font-style: normal; }
#tbChecks .badge[hidden] { display: none; }
@media (max-width: 1100px) { #checkPanel { width: 240px; } #secbar input { width: 110px; } #secbar > span { display: none; } }
#checks { list-style: none; margin: 0; padding: 0; font-size: 12px; }
#checks li { display: flex; gap: 6px; padding: 2px 0; }
#checks li b { width: 14px; flex: none; }
#checks li.ok b { color: var(--ok); } #checks li.bad b { color: var(--warn); }
.exports { display: flex; flex-direction: column; gap: 6px; } .exports .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 9px 8px; }
.exprow { display: flex; gap: 6px; } .exprow .btn { flex: 1; padding: 7px 6px; } .exports .btn[hidden] { display: none; }
main { position: relative; background: var(--view); min-width: 0; }
main canvas { display: block; width: 100%; height: 100%; }
#toolbar { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
#toolbar button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; color: var(--muted); padding: 6px 10px; border-radius: 7px; font: inherit; font-size: 12px; cursor: pointer; white-space: nowrap; }
#toolbar button:hover:not(:disabled) { background: var(--panel-2); color: var(--text); }
#toolbar button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
#toolbar button.icon { padding: 6px 7px; }
#toolbar button:disabled { opacity: .35; cursor: default; }
#toolbar button svg { flex: none; }
#toolbar button[hidden] { display: none; }
@media (max-width: 1320px) { #toolbar button span { display: none; } #toolbar button { padding: 6px 8px; } }
#viewpad { position: absolute; right: 14px; bottom: 12px; display: grid; grid-template-areas: "i i i s" ". t . ." "l f r k" ". b . ."; grid-template-columns: repeat(4, 46px); gap: 3px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
#viewpad button { border: 0; background: var(--panel-2); color: var(--muted); font: inherit; font-size: 10.5px; padding: 4px 0; border-radius: 6px; cursor: pointer; display: grid; place-items: center; }
#viewpad button.fit { display: flex; gap: 6px; justify-content: center; align-items: center; padding: 7px 0; font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
#viewpad button:hover { color: var(--accent); background: var(--accent-soft); }
#vpBaseCut { margin-bottom: 2px; color: var(--text) !important; }
#vpBaseCut.on { color: var(--accent) !important; background: var(--accent-soft); }
#viewpad { bottom: 104px; }   /* clear of the bottom toolbar and the Section bar above it */
@media (min-width: 1500px) { #viewpad { bottom: 12px; } }
.info { display: inline-grid; place-items: center; width: 14px; height: 14px; margin-left: 5px; border-radius: 50%; border: 1px solid currentColor; color: var(--muted); font: italic 700 9px/1 Georgia, serif; vertical-align: 1px; cursor: help; text-transform: none; letter-spacing: 0; opacity: .8; }
.info:hover { color: var(--accent); opacity: 1; }
.info[hidden] { display: none; }
.tbsep { width: 1px; background: var(--line); margin: 4px 2px; }
#secbar { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 5px 10px; font-size: 12px; color: var(--muted); box-shadow: 0 4px 16px rgba(0,0,0,.08); }
#secbar[hidden] { display: none; }

const VIEWS = { front: [0, 0, 1], back: [0, 0, -1], right: [1, 0, 0], left: [-1, 0, 0], top: [0, 1, 0.0001], bottom: [0, -1, 0.0001], iso: [0.55, 0.35, 0.76] };
let viewAnim = 0;
function setView(name, bb = lastStats?.bb) {
  if (!bb) return;

  const dist = r / Math.sin(camera.fov * DEG / 2) * 1.05;

// Filament colour toolbox on the right of the view: a chip per part opens a flyout of common filament colours plus a
// custom picker. It sets the same colours as Print › Colors.
const FILAMENTS = [['White', '#f5f5f2'], ['Natural', '#f2ede4'], ['Beige', '#d9c3a0'], ['Silver', '#c0c2c4'], ['Grey', '#8a8d91'], ['Black', '#232325'],
  ['Red', '#c8312f'], ['Orange', '#ec7a2c'], ['Yellow', '#f3c932'], ['Green', '#3f9b4f'], ['Teal', '#1f9e9a'], ['Blue', '#2f6fd0'],
  ['Navy', '#23365f'], ['Purple', '#7a4fb5'], ['Pink', '#ee8fb4'], ['Brown', '#7b5236'], ['Wood', '#a87b4f'], ['Gold', '#c9a443']];
{
  const box = document.getElementById('colorbox'), fly = document.getElementById('swatches'), grid = fly.querySelector('.grid'), custom = fly.querySelector('input');
  let openKey = null;
  grid.innerHTML = FILAMENTS.map(([n, c]) => `<button data-c="${c}" title="${n}" style="background:${c}"></button>`).join('');
  const syncChips = () => {
    box.querySelectorAll('.chip').forEach(ch => { ch.style.background = getK(ch.dataset.key); ch.classList.toggle('open', ch.dataset.key === openKey); });
    if (openKey) { const v = getK(openKey).toLowerCase(); custom.value = v; grid.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.c === v)); }
  };
  const pick = c => { changed(openKey, c); refreshAll(); syncChips(); };
  box.querySelectorAll('.chip').forEach(ch => ch.addEventListener('click', () => {
    openKey = openKey === ch.dataset.key ? null : ch.dataset.key;
    fly.hidden = !openKey; fly.style.top = ch.offsetTop - 8 + 'px';
    if (openKey) fly.querySelector('.swt').textContent = (openKey === 'color' ? 'Shade' : 'Base') + ' filament';
    syncChips();
  }));
  grid.addEventListener('click', e => { const b = e.target.closest('button'); if (b) pick(b.dataset.c); });
  custom.addEventListener('input', () => pick(custom.value));
  document.addEventListener('pointerdown', e => { if (openKey && !box.contains(e.target)) { openKey = null; fly.hidden = true; syncChips(); } }, true);
  controlsList.push({ el: box, sync: syncChips });   // follows undo, loading a project and the Print tab pickers
  syncChips();
}

// Collapsible groups: everything after a heading (up to the next one) moves into a body that the heading folds away.
// Each control still shows/hides on its own conditions inside the body. Folded headings are remembered per browser.
{
  let folded = {};
  const groups = [];
  try { folded = JSON.parse(localStorage.getItem('illum.folded') || '{}'); } catch (e) { /* storage unavailable */ }
  const save = () => { try { localStorage.setItem('illum.folded', JSON.stringify(folded)); } catch (err) { /* storage unavailable */ } };
  for (const panel of document.querySelectorAll('.panel, .sub')) for (const h of [...panel.querySelectorAll(':scope > h3')]) {
    const body = document.createElement('div'); body.className = 'grpbody';
    while (h.nextElementSibling && !h.nextElementSibling.matches('h3')) body.append(h.nextElementSibling);
    // heading and body sit in one bordered card so neighbouring open groups don't run together
    const grp = document.createElement('section'); grp.className = 'grp';
    h.before(grp); grp.append(h, body);
    const id = panel.id + ':' + h.firstChild.textContent;
    const set = on => { h.classList.toggle('collapsed', on); body.classList.toggle('collapsed', on); folded[id] = on; };
    set(!!folded[id]);
    groups.push({ panel: panel.closest('.panel'), h, set });
    h.addEventListener('click', e => {
      if (e.target.closest('.info')) return;
      set(!h.classList.contains('collapsed')); save(); syncFold();
    });
  }
  // the button over the panels folds every group of the open tab, or opens them all again when they're all folded
  const btn = document.getElementById('foldAll');
  const ICON_FOLD = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 20 5-5 5 5"/><path d="m7 4 5 5 5-5"/></svg>';
  const ICON_OPEN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></svg>';
  const mine = () => groups.filter(g => g.panel.classList.contains('on') && g.h.offsetParent);
  syncFold = () => {
    const anyOpen = mine().some(g => !g.h.classList.contains('collapsed'));
    btn.innerHTML = anyOpen ? ICON_FOLD : ICON_OPEN;
    btn.title = btn.ariaLabel = anyOpen ? 'Collapse all groups' : 'Expand all groups';

  btn.addEventListener('click', () => {
    const list = mine(), fold = list.some(g => !g.h.classList.contains('collapsed'));
    list.forEach(g => g.set(fold)); save(); syncFold();
  });
  syncFold();
}

// Saving: where the browser supports it (Chrome, Edge) a save dialog asks for the folder and name first — it remembers
// the last folder per kind of file. Elsewhere (Safari) the file goes to the browser's download location.
const slug = n => (n || 'lamp').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-').toLowerCase() || 'lamp';
async function pickTarget(name, kind) {   // returns a file handle, 'download', or null if the user cancelled
  if (!window.showSaveFilePicker) {
    let told = false; try { told = localStorage.getItem('illum.saveHint') === '1'; } catch {}
    if (!told) {
      alert('This browser can’t show a “Save to…” folder picker, so the file will go to your Downloads folder.\n\n' +
        '• Safari: Settings → General → File download location → “Ask for each download”.\n' +
        '• Or open Illuminate3D in Chrome or Edge, which ask where to save every time.');
      try { localStorage.setItem('illum.saveHint', '1'); } catch {}

    return 'download';
  }
  const types = kind === 'stl' ? [{ description: 'STL model', accept: { 'application/octet-stream': ['.stl'] } }] : [{ description: 'Illuminate3D design', accept: { 'application/json': ['.json'] } }];
  try { return await showSaveFilePicker({ suggestedName: name, types, id: 'illuminate3d-' + kind }); }
  catch (e) {
    if (e.name === 'AbortError') return null;
    // retry without the optional hints in case this browser rejects one of them
    try { return await showSaveFilePicker({ suggestedName: name }); }
    catch (e2) { if (e2.name === 'AbortError') return null; alert(`The save dialog couldn’t open (${e2.message}), so the file will go to Downloads.`); return 'download'; }

}

function stlBlob(mesh) {

  const buf = new ArrayBuffer(84 + 50 * nt), dv = new DataView(buf);

  dv.setUint32(80, nt, true);

const busy = document.getElementById('busy');
function buildPart(name, q) {   // watertight part in print orientation

    const S = buildShade(q.n, q.layer);
    const body = keep(new W.Manifold(new W.Mesh({ numProp: 3, vertProperties: S.pos, triVerts: S.idx })));
    const conn = shadeConnector(S, q.seg);
    return conn ? keep(body.add(conn)) : body;
  }
  if (name === 'cover') return keep(buildCover(q.seg).rotate([180, 0, 0]));   // cover prints top-down

async function exportPlate() {
  if (!W) return;

    const q = QUALITY[P.exportQ], pr = PRINTERS[P.printer], B = baseDims();

      const tall = items.findIndex(it => it.h > pr.z);
      if (tall >= 0) throw new Error(`the ${names[tall]} is ${items[tall].h.toFixed(0)} mm tall, over the ${pr.z} mm build height`);
      const pos = packBed(items, pr.x, pr.y);
      if (!pos) throw new Error(`the parts don’t fit together on the ${pr.label} bed — export them one by one`);
      const placed = mans.map((m, i) => keep(m.translate([pos[i][0], pos[i][1], -boxes[i].min[2]])));
